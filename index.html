<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WINNING Shipping AI - 船舶智能合规平台</title>
<link rel="stylesheet" href="frontend/style.css">
<style>
/* ====== 船舶动态面板 ====== */
.fleet-panel { display: none; padding: 16px; height: 100%; overflow-y: auto; flex-direction: column; }
.fleet-panel.active { display: flex; }
.fleet-panel.hidden { display: none; }
.fleet-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.fleet-header h3 { font-size: 16px; color: var(--primary); margin: 0; }
.fleet-stats { display: flex; gap: 8px; font-size: 12px; }
.fleet-stat { padding: 2px 10px; border-radius: 12px; font-weight: 600; }
.fleet-stat.sea { background: #d4edda; color: #155724; }
.fleet-stat.anchor { background: #fff3cd; color: #856404; }
.fleet-stat.moored { background: #f8d7da; color: #721c24; }
.fleet-time { font-size: 11px; color: var(--text-light); margin-bottom: 8px; }
.fleet-filter { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.fleet-filter button { padding: 4px 12px; border-radius: 14px; border: 1px solid var(--border); background: white; font-size: 12px; cursor: pointer; transition: all .15s; }
.fleet-filter button:hover { border-color: var(--primary); }
.fleet-filter button.active { background: var(--primary); color: white; border-color: var(--primary); }
.fleet-filter button.active.sea-filter { background: #28a745; border-color: #28a745; }
.fleet-filter button.active.anchor-filter { background: #ffc107; color: #333; border-color: #ffc107; }
.fleet-filter button.active.moored-filter { background: #dc3545; border-color: #dc3545; }
.fleet-search { padding: 6px 14px; border: 1px solid var(--border); border-radius: 16px; font-size: 13px; outline: none; flex: 1; min-width: 120px; }
.fleet-search:focus { border-color: var(--primary); }
.fleet-section { margin-bottom: 16px; }
.fleet-section h4 { font-size: 14px; color: var(--text); padding-bottom: 4px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.fleet-section h4 span { font-weight: 400; font-size: 12px; color: var(--text-light); }
.fleet-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  padding: 10px 12px;
  cursor: pointer;
  transition: box-shadow .15s;
}
.fleet-card:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.fleet-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.fleet-name { font-weight: 600; font-size: 13px; min-width: 130px; }
.fleet-status-badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; }
.fleet-status-badge.sea { background: #d4edda; color: #155724; }
.fleet-status-badge.anchor { background: #fff3cd; color: #856404; }
.fleet-status-badge.moored { background: #f8d7da; color: #721c24; }
.fleet-speed { font-size: 12px; color: #555; }
.fleet-dest { font-size: 12px; }
.fleet-dest b { color: var(--primary); }
.fleet-eta { font-size: 11px; color: #888; }
.fleet-eta.overdue { color: var(--danger); }
.fleet-details {
  display: none;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
  font-size: 12px;
  color: #888;
  gap: 4px 14px;
  flex-wrap: wrap;
}
.fleet-card.expanded .fleet-details { display: flex; }
.fleet-toggle {
  padding: 8px 16px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 8px;
  color: var(--primary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}
.fleet-toggle:hover { border-color: var(--primary); background: var(--primary-light); }
.fleet-toggle.active { background: var(--primary); color: white; }
.fleet-loading { text-align: center; padding: 40px; color: var(--text-light); font-size: 13px; }
.fleet-footer { font-size: 11px; color: var(--text-light); text-align: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); }
.empty-fleet { text-align: center; padding: 30px; color: var(--text-light); }

/* ====== 体系 / 船舶 / 技术 通用面板 ====== */
/* 覆盖面板 - 用于体系/技术/船舶模块的内容浏览 */
.overlay-panel {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 100;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.25s ease;
}
.overlay-panel.hidden { display: none; }
.overlay-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.overlay-header h3 {
  font-size: 16px;
  color: var(--primary);
  margin: 0;
  flex: 1;
}
.overlay-close {
  background: transparent;
  border: none;
  font-size: 14px;
  color: var(--primary);
  cursor: pointer;
  padding: 4px 8px;
  font-weight: 600;
}
.overlay-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.panel-header { margin-bottom: 12px; }
.panel-header h3 { font-size: 16px; color: var(--primary); margin: 0 0 4px 0; }
.panel-header p { font-size: 12px; color: var(--text-light); margin: 0; }

.panel-search-box { display: flex; gap: 8px; margin-bottom: 12px; }
.panel-search-box input {
  flex:1; padding: 8px 14px; border:1px solid var(--border); border-radius:20px; font-size:13px; outline:0;
}
.panel-search-box input:focus { border-color:var(--primary); }

.panel-placeholder { text-align: center; padding: 30px 20px; }
.panel-placeholder h4 { font-size: 14px; color: var(--text); margin-bottom: 12px; }
.sug-card {
  display: inline-block; margin: 4px; padding: 8px 16px; border-radius: 8px;
  background: var(--card-bg); border: 1px solid var(--border); font-size: 13px;
}

/* ====== 船舶知识库 ====== */
.ship-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; margin-bottom: 16px; }
.ship-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; cursor: pointer; transition: all .15s;
}
.ship-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-color: var(--primary); }
.ship-card h4 { margin: 0 0 6px 0; font-size: 14px; }
.ship-card h4 span { font-weight: 400; font-size: 11px; color: var(--text-light); }
.ship-card .certs { display: flex; flex-wrap: wrap; gap: 4px; }
.ship-card .certs span { font-size: 11px; padding: 1px 8px; background: var(--primary-light); color: var(--primary); border-radius: 10px; }
.ship-card.expanded { cursor: default; border-color: var(--primary); }
.ship-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); max-height: 300px; overflow-y: auto; }
.ship-card.expanded .ship-detail { display: block; }
.ship-detail-item { padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
.ship-detail-item:last-child { border-bottom: none; }
.ship-detail-item b { color: #333; }
.ship-detail-item .exp { color: #e67e22; font-size: 11px; margin-left: 8px; }
.ship-detail-item .exp.urgent { color: #e74c3c; font-weight: 600; }
.ship-stat-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.ship-stat { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--primary-light); color: var(--primary); }
.ship-stat.total { background: #e8f0fe; color: #1967d2; }
.ship-cat-title { font-size: 13px; font-weight: 600; color: var(--text); margin: 12px 0 8px 0; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

/* ====== 技术资料 ====== */
.tech-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
.tech-card h5 { margin: 0 0 4px 0; font-size: 13px; }
.tech-card p { font-size: 12px; color: #666; margin: 0; }
.tech-card .info { font-size: 11px; color: #999; margin-top: 4px; }

/* entry cards */
.entry-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.entry-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px 12px; cursor: pointer; text-align: center; transition: all .2s; }
.entry-card:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(0,0,0,.08); transform: translateY(-1px); }
.entry-card .e-icon { font-size: 28px; display: block; margin-bottom: 6px; }
.entry-card .e-title { font-size: 14px; font-weight: 600; color: var(--text); }
.entry-card .e-desc { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.entry-card .e-badge { display: inline-block; font-size: 10px; padding: 2px 10px; border-radius: 10px; background: var(--primary-light); color: var(--primary); margin-top: 6px; }
.sub-panel { display: none; }
.sub-panel.active { display: block; }
.sub-back { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 16px; font-size: 12px; cursor: pointer; margin-bottom: 10px; color: var(--primary); background: white; transition: all .15s; }
.sub-back:hover { border-color: var(--primary); background: var(--primary-light); }
.contact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.contact-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.contact-card h5 { margin: 0 0 6px 0; font-size: 14px; }
.contact-card table { width: 100%; font-size: 12px; border-collapse: collapse; }
.contact-card td { padding: 4px 6px; border-bottom: 1px solid #f0f0f0; }
.contact-card td:first-child { color: #666; white-space: nowrap; width: 80px; }
</style>
</head>
<body>
<div id="app">
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-top">
      <h1 class="logo">🚢 WINNING <span>Shipping AI</span></h1>
      <span class="version">v2.0</span>
    </div>
    <p class="subtitle">船舶法规 · 体系 · 技术 · 智能合规助手</p>
  </header>

  <!-- 模块切换 -->
  <nav class="module-nav">
    <button class="module-btn active" data-module="regulations" onclick="switchModule('regulations')">
      <span class="icon">📋</span>
      <span class="label">法规</span>
    </button>
    <button class="module-btn" data-module="systems" onclick="switchModule('systems')">
      <span class="icon">🏢</span>
      <span class="label">体系</span>
    </button>
    <button class="module-btn" data-module="tech" onclick="switchModule('tech')">
      <span class="icon">🔧</span>
      <span class="label">技术</span>
    </button>
    <button class="module-btn" data-module="ships" onclick="switchModule('ships')">
      <span class="icon">🚢</span>
      <span class="label">船舶</span>
    </button>
  </nav>

  <!-- 快捷指令（仅法规模块使用） -->
  <div class="quick-actions" id="quickActions"></div>
  
    <main class="chat-area" id="chatArea">
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-icon" id="welcomeIcon">📋</div>
      <h2 id="welcomeTitle">法规咨询</h2>
      <p id="welcomeDesc">问答式查询 · 图片上传合规分析</p>
      <div id="welcomeCards" class="entry-grid" style="max-width:400px;margin:16px auto 0">
        <div class="entry-card" onclick="document.getElementById('messageInput').focus()"><span class="e-icon">💬</span><span class="e-title">自由提问</span><span class="e-desc">输入法规关键词或问题</span></div>
        <div class="entry-card" onclick="quickAsk('请列举SOLAS公约主要内容')"><span class="e-icon">📄</span><span class="e-title">SOLAS查询</span><span class="e-desc">公约条款速查</span></div>
        <div class="entry-card" onclick="document.getElementById('imageInput').click()"><span class="e-icon">📷</span><span class="e-title">图片分析</span><span class="e-desc">上传照片判断合规性</span></div>
        <div class="entry-card" onclick="quickAsk('PSC检查常见缺陷有哪些？')"><span class="e-icon">🔗</span><span class="e-title">PSC缺陷</span><span class="e-desc">缺陷描述匹配条款</span></div>
      </div>
    </div>
    <div id="messages"></div>
    <div id="loadingIndicator" class="loading hidden">
      <div class="dot-pulse"></div>
      <span>思考中...</span>
    </div>
  </main>
  
  <!-- 📋 内容浏览覆盖面板（体系/技术/船舶 分类浏览用） -->
  <div class="overlay-panel hidden" id="overlayPanel">
    <div class="overlay-header">
      <button class="overlay-close" onclick="closeOverlay()">← 返回</button>
      <h3 id="overlayTitle"></h3>
    </div>
    <div class="overlay-content" id="overlayContent"></div>
  </div>
<!-- 输入区域 -->
  <footer class="input-area">
    <div class="input-wrapper">
      <button class="attach-btn" id="imageUploadBtn" title="上传图片">
        <span>📷</span>
        <input type="file" id="imageInput" accept="image/*" hidden>
      </button>
      <button class="attach-btn" id="fileUploadBtn" title="上传文件（仅本地知识库模块）">
        <span>📎</span>
        <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt" hidden>
      </button>
      <textarea id="messageInput" rows="1" placeholder="输入法规问题，如：lifeboat要求..."></textarea>
      <button class="send-btn" id="sendBtn" disabled><span>➤</span></button>
    </div>
    <p class="input-hint">WINNING Shipping AI · 仅供参考，请以IMO官方原文为准</p>
  </footer>
</div>

<!-- 图片预览弹窗 -->
<div id="imagePreview" class="modal hidden">
  <div class="modal-content">
    <img id="previewImg" src="" alt="预览">
    <button class="modal-close" onclick="closeImagePreview()">✕</button>
    <div class="modal-actions">
      <button class="btn-primary" onclick="analyzeImage()">📷 分析此图片</button>
      <button class="btn-secondary" onclick="removeImage()">移除</button>
    </div>
  </div>
</div>

<script>
// ====== CONFIG ======
const CONFIG = {
  API_BASE_URL: 'https://api.winningshippingai.com',
  modules: {
    regulations: {
      name: '法规', icon: '📋',
      placeholder: '输入法规问题，如：lifeboat维护要求...',
      description: 'IMO公约 · SOLAS · MARPOL · MLC',
      quickActions: [
        { text: '🛟 救生设备', query: '救生设备有哪些检查要求？' },
        { text: '🔥 消防设备', query: '消防设备检验周期是什么？' },
        { text: '📋 PSC缺陷', query: 'PSC检查常见缺陷有哪些？' },
        { text: '🌍 MARPOL VI', query: 'MARPOL附则VI的最新要求' }
      ],
      supportImage: true
    },
    systems: {
      name: '体系', icon: '🏢',
      placeholder: '输入体系文件问题，如：机舱值班制度...',
      description: '公司体系文件 · SMS · 管理制度',
      quickActions: [
        { text: '📋 管理体系', query: '公司管理体系文件有哪些？' },
        { text: '📝 操作规程', query: '关键操作有哪些规程要求？' }
      ],
      supportImage: false
    },
    tech: {
      name: '技术', icon: '🔧',
      placeholder: '输入技术资料问题，如：副机型号参数...',
      description: '设备手册 · 技术参数 · 维护保养',
      quickActions: [
        { text: '⚙️ 设备列表', query: '有哪些主要设备的技术资料？' },
        { text: '🔧 维护周期', query: '主要设备的维护保养周期？' }
      ],
      supportImage: true
    },
    ships: {
      name: '船舶', icon: '🚢',
      placeholder: '输入船舶名称或证书问题...',
      description: '船队资料 · 证书 · 检验报告',
      quickActions: [
        { text: '📋 证书查询', query: '各船有哪此证书？' },
        { text: '📅 到期提醒', query: '哪些证书即将到期？' },
        { text: '📍 船舶动态', query: '查看船舶动态' },
        { text: '🔍 搜索', query: '' }
      ],
      supportImage: false
    },

  }
};

// ====== 状态管理 ======
const STATE = {
  currentModule: 'regulations',
  messages: {},
  imageData: null,
  conversationHistory: {},
  isProcessing: false,
  fleetShowing: false,
  fleetData: null,
  fleetFilter: 'all'
};

try {
  const saved = localStorage.getItem('wsai_history');
  if (saved) STATE.conversationHistory = JSON.parse(saved);
} catch(e) {}

// ====== DOM ======
const els = {
  chatArea: document.getElementById('chatArea'),
  messages: document.getElementById('messages'),
  welcome: document.getElementById('welcomeScreen'),
  input: document.getElementById('messageInput'),
  sendBtn: document.getElementById('sendBtn'),
  loading: document.getElementById('loadingIndicator'),
  quickActions: document.getElementById('quickActions'),
  imageInput: document.getElementById('imageInput'),
  fileInput: document.getElementById('fileInput'),
  imageUploadBtn: document.getElementById('imageUploadBtn'),
  imagePreview: document.getElementById('imagePreview'),
  previewImg: document.getElementById('previewImg'),
  fleetContent: document.getElementById('fleetContent')
};

// ====== 船舶知识库加载 ======
const SHIP_DATA_URL = 'data/ship_knowledge.json';

async function loadShipKnowledge() {
  try {
    const resp = await fetch(SHIP_DATA_URL + '?_t=' + Date.now());
    STATE.shipKnowledge = await resp.json();
    renderShipKnowledge('');
  } catch(e) {
    const el = document.getElementById('shipContent');
    if (el) el.innerHTML = '<div class="empty-fleet"><p>⚠️ 加载失败: ' + e.message + '</p></div>';
  }
}

function renderShipKnowledge(searchText) {
  const data = STATE.shipKnowledge;
  const list = document.getElementById('shipContent');
  const statBar = document.getElementById('shipStatBar');
  
  if (!data) {
    list.innerHTML = '<div class="fleet-loading"><div class="dot-pulse"></div><span>加载船舶数据...</span></div>';
    return;
  }
  
  const ships = data.ships || [];
  const totalCerts = data.total_certs || 0;
  
  // 过滤
  const st = (searchText || '').toUpperCase();
  const filtered = st ? ships.filter(s => s.name.toUpperCase().includes(st) || s.certs.some(c => c.toUpperCase().includes(st))) : ships;
  
  statBar.innerHTML = `
    <span class="ship-stat total">🚢 ${ships.length} 艘船</span>
    <span class="ship-stat">📄 ${totalCerts} 份证书</span>
    <span class="ship-stat">${filtered.length < ships.length ? '</span><span class="ship-stat">🔍 筛选出 ' + filtered.length + ' 艘' : ''}</span>
  `;
  
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-fleet"><p>没有匹配的船舶</p></div>';
    return;
  }
  
  const winning = filtered.filter(s => s.name.startsWith('WINNING'));
  const sunny = filtered.filter(s => s.name.startsWith('SUNNY') && s.name !== 'SUNNY SAILOR');
  const other = filtered.filter(s => !s.name.startsWith('WINNING') && !s.name.startsWith('SUNNY'));
  
  let html = '';
  
  function sec(title, ships) {
    if (!ships.length) return '';
    let s = '<div class="ship-cat-title">' + title + ' <span style="font-weight:400;font-size:12px;color:var(--text-light)">(' + ships.length + '艘)</span></div>';
    s += '<div class="ship-grid">';
    ships.forEach(sh => {
      s += '<div class="ship-card" onclick="toggleShipDetail(this,\'' + sh.name.replace(/'/g, "\\'") + '\')">';
      s += '<h4>' + sh.name + ' <span>' + sh.count + '份文件</span></h4>';
      s += '<div class="certs">';
      (sh.certs || []).slice(0, 6).forEach(c => { s += '<span>' + c + '</span>'; });
      if ((sh.certs || []).length > 6) s += '<span>+更多</span>';
      s += '</div>';
      s += '<div class="ship-detail" id="detail-' + sh.name.replace(/[ .]+/g, '_') + '"></div>';
      s += '</div>';
    });
    s += '</div>';
    return s;
  }
  
  html += sec('WINNING 系列', winning);
  html += sec('SUNNY 系列', sunny);
  html += sec('其他', other);
  
  list.innerHTML = html;
}

function toggleShipDetail(el, shipName) {
  el.classList.toggle('expanded');
  if (el.classList.contains('expanded')) {
    const detailId = 'detail-' + shipName.replace(/[ .]+/g, '_');
    const detailEl = document.getElementById(detailId);
    if (detailEl && detailEl.innerHTML === '') {
      loadShipDetail(shipName, detailEl);
    }
  }
}

function loadShipDetail(shipName, el) {
  const byShip = (STATE.shipKnowledge && STATE.shipKnowledge.by_ship) || {};
  const docs = byShip[shipName] || [];
  if (docs.length === 0) {
    el.innerHTML = '<div class="empty-fleet"><p>暂无详细数据</p></div>';
    return;
  }
  let html = '';
  docs.slice(0, 30).forEach(d => {
    const urgent = d.expiry && (d.expiry.includes('2024') || d.expiry.includes('2025-01') || d.expiry.includes('2025-02') || d.expiry.includes('2025-03'));
    html += '<div class="ship-detail-item">';
    html += '<b>' + (d.cert || d.file.slice(0,30)) + '</b>';

  let html = '';

  for (const [ship, docs] of Object.entries(byShip)) {

      return d.file.toUpperCase().includes(st) || d.cert.toUpperCase().includes(st) || (d.md || '').toUpperCase().includes(st);

    if (techDocs.length === 0) continue;

      html += '<p>' + d.file.slice(0, 60) + '</p>';

    });

  list.innerHTML = html;
}

function getStatusClass(s) {
  if (s === '锚泊') return 'anchor';
  if (s === '系泊') return 'moored';
  return 'sea';
}

function renderFleet() {
  if (!STATE.fleetData) return;
  const container = document.getElementById('fleetContent');
  const search = document.getElementById('fleetSearchInput');
  const searchText = search ? search.value.toLowerCase().trim() : '';
  
  let vessels = STATE.fleetData.vessels || [];
  let filtered = vessels.filter(v => {
    if (STATE.fleetFilter !== 'all' && getStatusClass(v.status) !== STATE.fleetFilter) return false;
    if (searchText && !v.name.toLowerCase().includes(searchText) && !(v.destination||'').toLowerCase().includes(searchText)) return false;
    return true;
  });

  const winning = filtered.filter(v => v.name.startsWith('WINNING'));
  const sunny = filtered.filter(v => v.name.startsWith('SUNNY'));

  // 只更新船舶列表部分，不重建头部和搜索框
  let listHtml = '';

  function sec(title, vs) {
    let s = `<div class="fleet-section"><h4>${title} <span>(${vs.length}艘)</span></h4>`;
    vs.forEach(v => {
      const sc = getStatusClass(v.status);
      const overdue = v.eta && v.eta < '2026-05-01';
      s += `<div class="fleet-card" onclick="this.classList.toggle('expanded')">
        <div class="fleet-row">
          <span class="fleet-name">${v.name}</span>
          <span class="fleet-status-badge ${sc}">${v.status==='在航'?'🟢':v.status==='锚泊'?'🟡':'🔴'} ${v.status}</span>
          ${v.speed_kn ? `<span class="fleet-speed">${v.speed_kn}kn</span>` : ''}
          ${v.destination ? `<span class="fleet-dest">→ <b>${v.destination}</b></span>` : ''}
          ${v.eta ? `<span class="fleet-eta ${overdue?'overdue':''}">ETA ${v.eta}</span>` : ''}
        </div>
        <div class="fleet-details">
          ${v.lat ? `<span>📍 ${v.lat.toFixed(2)}, ${v.lon.toFixed(2)}</span>` : ''}
          ${v.heading_deg ? `<span>🧭 ${v.heading_deg}°</span>` : ''}
          ${v.draught_m ? `<span>📏 ${v.draught_m}m</span>` : ''}
          ${v.mmsi ? `<span>📡 ${v.mmsi}</span>` : ''}
          ${v.imo ? `<span>🆔 ${v.imo}</span>` : ''}
          ${v.updateTime ? `<span>⏱ ${v.updateTime}</span>` : ''}
        </div>
      </div>`;
    });
    s += '</div>';
    return s;
  }

  if (winning.length) listHtml += sec('WINNING 系列', winning);
  if (sunny.length) listHtml += sec('SUNNY 系列', sunny);
  if (!filtered.length) listHtml += '<div class="empty-fleet"><p>没有匹配的船舶</p></div>';

  // 找到或创建列表容器
  let listEl = document.getElementById('fleetList');
  if (!listEl) {
    listEl = document.createElement('div');
    listEl.id = 'fleetList';
    // 插入到搜索框后面
    const filterEl = container.querySelector('.fleet-filter');
    if (filterEl) filterEl.after(listEl);
    else container.appendChild(listEl);
  }
  listEl.innerHTML = listHtml;
}

// ====== 发送消息 ======
async function sendMessage() {
  const text = els.input.value.trim();
  if (!text && !STATE.imageData) return;
  if (STATE.isProcessing) return;
  
  STATE.isProcessing = true;
  els.sendBtn.disabled = true;
  
  els.welcome.classList.add('hidden');
  
  const userMsg = { role: 'user', text: text, image: STATE.imageData };
  addMessage(userMsg);
  
  els.input.value = '';
  els.input.style.height = 'auto';
  
  els.loading.classList.remove('hidden');
  scrollToBottom();
  
  try {
    const response = await callAPI(text, STATE.currentModule, STATE.imageData);
    els.loading.classList.add('hidden');
    addMessage({ role: 'assistant', text: response.reply });
    saveHistory(text, response.reply);
    if (STATE.imageData) STATE.imageData = null;
  } catch (err) {
    els.loading.classList.add('hidden');
    addMessage({ role: 'assistant', text: `⚠️ 抱歉，请求失败了：${err.message || '网络错误，请稍后重试'}` });
  }
  
  STATE.isProcessing = false;
  els.sendBtn.disabled = false;
  scrollToBottom();
}

async function callAPI(message, module, imageData) {
  const history = STATE.conversationHistory[module] || [];
  const lastHistory = history.slice(-6).map(h => ({ role: h.role, content: h.text }));
  
  const body = { message, module, history: lastHistory, imageUrl: imageData };
  
  const response = await fetch(`${CONFIG.API_BASE_URL}/api/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.detail || `HTTP ${response.status}`);
  }
  
  return response.json();
}

// ====== 消息渲染 ======
function addMessage(msg) {
  const div = document.createElement('div');
  div.className = `message ${msg.role}`;
  const avatar = msg.role === 'user' ? '👤' : '🤖';
  let content = '';
  if (msg.image) content += `<img src="${msg.image}" class="image-attachment" alt="上传图片">`;
  if (msg.text) content += formatMessage(msg.text);
  div.innerHTML = `<div class="message-avatar">${avatar}</div><div class="message-content">${content}</div>`;
  els.messages.appendChild(div);
  scrollToBottom();
}

function formatMessage(text) {
  if (!text) return '';
  let html = text;
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/SOLAS[^\s,。；]*|MARPOL[^\s,。；]*|MLC[^\s,。；]*/g, match => {
    const safe = match.replace(/'/g, "\\'");
    return `<span class="citation" onclick="quickAsk('请详细展示${safe}的中文原文和英文原文对照')">${match}</span>`;
  });
  const paragraphs = html.split('\n\n');
  html = paragraphs.map(p => {
    const trimmed = p.trim();
    if (!trimmed) return '';
    if (trimmed.match(/^[\-\*]\s/m)) {
      const items = trimmed.split('\n').filter(l => l.match(/^[\-\*]\s/));
      return '<ul>' + items.map(i => `<li>${i.replace(/^[\-\*]\s/, '')}</li>`).join('') + '</ul>';
    }
    if (trimmed.match(/^\d+\.\s/m)) {
      const items = trimmed.split('\n').filter(l => l.match(/^\d+\.\s/));
      return '<ol>' + items.map(i => `<li>${i.replace(/^\d+\.\s/, '')}</li>`).join('') + '</ol>';
    }
    if (trimmed.startsWith('>')) {
      return `<blockquote>${trimmed.replace(/^>\s?/gm, '').replace(/\n/g, '<br>')}</blockquote>`;
    }
    return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return html;
}

function compressImage(dataUrl, maxWidth, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality || 0.7));
    };
    img.src = dataUrl;
  });
}

function searchKnowledgeBaseOverlay(category, type) {
  const contentEl = document.getElementById('overlayContent');
  contentEl.innerHTML = '<div class=panel-placeholder><p>⏳ 加载中…</p></div>';
  
  const db = type === 'tech' ? STATE.techKnowledge : STATE.shipKnowledge;
  if (!db || !db.documents) {
    fetch('/api/data?list=' + (type || 'ship')).then(r => r.json()).then(data => {
      if (type === 'tech') STATE.techKnowledge = data;
      else STATE.shipKnowledge = data;
      renderToOverlay(category, type || 'ship', data);
    }).catch(function() {
      contentEl.innerHTML = '<div class=panel-placeholder><p>暂无内容</p></div>';
    });
    return;
  }
  renderToOverlay(category, type || 'ship', db);
}

function renderToOverlay(category, type, db) {
  const contentEl = document.getElementById('overlayContent');
  var docs = db.documents || {};
  var results = [];
  var seen = {};
  
  for (var id in docs) {
    var d = docs[id];
    var k = d.filename + (d.llm_md || '').slice(0, 80);
    if (seen[k]) continue;
    seen[k] = 1;
    results.push(d);
    if (results.length >= 100) break;
  }
  
  if (results.length === 0) {
    contentEl.innerHTML = '<div class=panel-placeholder><p>暂无数据</p></div>';
    return;
  }
  
  var h = '<div class=ship-stat-bar><span class=ship-stat total>📄 ' + results.length + ' 条</span></div>';
  h += '<div class=ship-grid>';
  results.forEach(function(d) {
    var md = d.llm_md || '';
    var preview = md.split('\\n').slice(0, 2).join(' | ');
    h += '<div class=ship-card onclick="this.classList.toggle(\'expanded\')"><h4>📄 ' + (d.filename || '?') + '</h4>';
    h += '<div class=certs><span>' + preview + '</span></div>';
    h += '<div class=ship-detail><p style=font-size:12px;color:var(--text-light)>' + md.slice(0, 300) + '</p></div>';
    h += '</div>';
  });
  h += '</div>';
  contentEl.innerHTML = h;
}

function renderShipCertificates(db) {
  const contentEl = document.getElementById('overlayContent');
  var docs = db.documents || {};
  
  var ships = {};
  for (var id in docs) {
    var d = docs[id];
    var fn = d.filename || '';
    var m = fn.match(/^(WINNING\s+\w+|SUNNY\s+\w+)/i);
    var s = m ? m[1].toUpperCase() : '其他';
    if (!ships[s]) ships[s] = [];
    var md = d.llm_md || '';
    var t = '文档';
    var exp = '';
    if (md) {
      var x = md.match(/文档类型[：:](.+)/);
      if (x) t = x[1].trim();
      x = md.match(/有效期[：:](.+)/);
      if (x) exp = x[1].trim();
    }
    ships[s].push({filename: d.filename || '?', type: t, expiry: exp});
  }
  
  var total = Object.values(ships).reduce(function(a, b) { return a + b.length; }, 0);
  var h = '<div class=ship-stat-bar><span class=ship-stat total>📄 ' + total + ' 份</span><span class=ship-stat>🚢 ' + Object.keys(ships).length + ' 艘</span></div>';
  
  var w = {}, su = {}, o = {};
  for (var s in ships) {
    if (s.startsWith('WINNING')) w[s] = ships[s];
    else if (s.startsWith('SUNNY')) su[s] = ships[s];
    else o[s] = ships[s];
  }
  
  function shipGroup(title, g) {
    var html = '<div class=ship-cat-title>' + title + '</div><div class=ship-grid>';
    for (var s in g) {
      var ct = g[s].map(function(d) { return d.type; }).filter(function(v, i, a) { return a.indexOf(v) === i; }).join(' · ');
      html += '<div class=ship-card onclick="this.classList.toggle(\'expanded\')"><h4>' + s + ' <span>(' + g[s].length + '份)</span></h4>';
      html += '<div class=certs><span>' + ct + '</span></div><div class=ship-detail>';
      g[s].forEach(function(d) {
        html += '<div class=ship-detail-item><b>' + d.filename + '</b>' + (d.expiry ? '<span class=exp>⏰ ' + d.expiry + '</span>' : '') + '</div>';
      });
      html += '</div></div>';
    }
    html += '</div>';
    return html;
  }
  
  if (Object.keys(w).length) h += shipGroup('WINNING 系列', w);
  if (Object.keys(su).length) h += shipGroup('SUNNY 系列', su);
  if (Object.keys(o).length) h += shipGroup('其他', o);
  contentEl.innerHTML = h;
}
