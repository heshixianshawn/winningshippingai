<script>
// ====== 防止CF Pages/浏览器对const声明的干扰，改为var全局声明 ======
var CONFIG = {
  API_BASE_URL: 'https://api.winningshippingai.com',
  modules: {
    regulations: {
      name: '法规', icon: '📋',

    },
    systems: {

      description: '公司体系文件 · SMS · 管理制度',
      quickActions: [
        { text: '📋 管理体系', query: '公司管理体系文件有哪些？' },
        { text: '📝 操作规程', query: '关键操作有哪些规程要求？' }
      ],
      supportImage: false
    },
    tech: {
      name: '技术', icon: '🔧',
      placeholder: '输入技术资料问题，如：副机型号参数...',
      description: '设备手册 · 技术参数 · 维护保养',
      quickActions: [
        { text: '⚙️ 设备列表', query: '有哪些主要设备的技术资料？' },
        { text: '🔧 维护周期', query: '主要设备的维护保养周期？' }
      ],
      supportImage: true
    },
    ships: {
      name: '船舶', icon: '🚢',
      placeholder: '输入船舶名称或证书问题...',
      description: '船队资料 · 证书 · 检验报告',
      quickActions: [
        { text: '📋 证书查询', query: '各船有哪此证书？' },
        { text: '📅 到期提醒', query: '哪些证书即将到期？' },
        { text: '📍 船舶动态', query: '查看船舶动态' },
        { text: '🔍 搜索', query: '' }
      ],
      supportImage: false
    },

  }
};

// ====== 状态管理 ======
var STATE = {
  currentModule: 'regulations',
  messages: {},
  imageData: null,
  uploadedFileContent: null,
  uploadedFileName: null,
  conversationHistory: {},
  isProcessing: false,
  fleetShowing: false,
  fleetData: null,
  fleetFilter: 'all'
};

try {
  const saved = localStorage.getItem('wsai_history');
  if (saved) STATE.conversationHistory = JSON.parse(saved);
} catch(e) {}

// ====== DOM ======
var els = {
  chatArea: document.getElementById('chatArea'),
  messages: document.getElementById('messages'),
  welcome: document.getElementById('welcomeScreen'),
  input: document.getElementById('messageInput'),
  sendBtn: document.getElementById('sendBtn'),
  loading: document.getElementById('loadingIndicator'),
  quickActions: document.getElementById('quickActions'),
  imageInput: document.getElementById('imageInput'),
  fileInput: document.getElementById('fileInput'),
  imageUploadBtn: document.getElementById('imageUploadBtn'),
  fileUploadBtn: document.getElementById('fileUploadBtn'),
  imagePreview: document.getElementById('imagePreview'),
  previewImg: document.getElementById('previewImg'),
  fleetContent: document.getElementById('fleetContent')
};

// ====== scrollToBottom ======
function scrollToBottom() {
  setTimeout(function() {
    const container = els.messages.parentElement || els.messages;
    container.scrollTop = container.scrollHeight;
  }, 10);
}

// 绑定事件（安全版：所有元素不存在时不报错）
(function() {
  function safeBind(el, evt, fn) {
    var e = el || null;
    if (e) { e[evt] = fn; }
  }
  safeBind(els.sendBtn, 'onclick', function(e) {
    if (els.input.value.trim()) sendMessage();
  });
  safeBind(els.input, 'onkeydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (els.input.value.trim()) sendMessage();
    }
  });
  safeBind(els.input, 'oninput', function(e) {
    els.sendBtn.disabled = !this.value.trim();
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
})();

// ====== 图片压缩 ======
function compressImage(dataUrl, maxWidth, quality) {
  maxWidth = maxWidth || 800;
  quality = quality || 0.6;
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

// ====== 图片/文件处理 ======
(function() {
  function bindClick(btn, target) {
    if (btn) {
      btn.onclick = function() {
        if (target) target.click();
      };
    }
  }
  bindClick(els.imageUploadBtn, els.imageInput);
  bindClick(els.fileUploadBtn, els.fileInput);
  els.fileInput.onchange = async function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var content = ev.target.result;
      // 截取前5000字符作为context上下文
      var snippet = content.substring(0, 5000);
      if (content.length > 5000) snippet += '\n...(文件较长，截取前5000字符)';
      STATE.uploadedFileContent = snippet;
      STATE.uploadedFileName = file.name;
      els.input.value = '📄 以下是文件【' + file.name + '】的内容，请直接分析：\n\n' + snippet + '\n\n[请基于以上文件内容回答用户的问题]';
      sendMessage();
    };
    if (file.type === 'text/plain' || file.name.endsWith('.txt')) {
      reader.readAsText(file, 'utf-8');
    } else {
      // PDF/DOC等作提示
      els.input.value = '⚠️ 【' + file.name + '】不支持直接读取。请将文件内容粘贴到输入框，或上传TXT文件。';
      sendMessage();
    }
    e.target.value = '';
  };
  // 选择图片
  els.imageInput.onchange = async function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = async function(ev) {
      var raw = ev.target.result;
      try {
        STATE.imageData = await compressImage(raw, 800, 0.6);
      } catch (e) {
        STATE.imageData = raw;
      }
      els.previewImg.src = STATE.imageData;
      els.imagePreview.classList.remove('hidden');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };
})();

window.analyzeImage = function() {
  els.imagePreview.classList.add('hidden');
  els.input.value = '请分析这张图片中的设备状态，判断是否存在不合规情况，并引用相关法规条款。';

function renderShipKnowledge(searchText) {
  const data = STATE.shipKnowledge;
  const list = document.getElementById('shipContent');
  const statBar = document.getElementById('shipStatBar');
  
  if (!data) {
    list.innerHTML = '<div class="fleet-loading"><div class="dot-pulse"></div><span>加载船舶数据...</span></div>';
    return;
  }
  
  const ships = data.ships || [];
  const totalCerts = data.total_certs || 0;
  
  // 过滤
  const st = (searchText || '').toUpperCase();
  const filtered = st ? ships.filter(s => s.name.toUpperCase().includes(st) || s.certs.some(c => c.toUpperCase().includes(st))) : ships;
  
  statBar.innerHTML = `
    <span class="ship-stat total">🚢 ${ships.length} 艘船</span>
    <span class="ship-stat">📄 ${totalCerts} 份证书</span>
    <span class="ship-stat">${filtered.length < ships.length ? '</span><span class="ship-stat">🔍 筛选出 ' + filtered.length + ' 艘' : ''}</span>
  `;
  
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-fleet"><p>没有匹配的船舶</p></div>';
    return;
  }
  
  const winning = filtered.filter(s => s.name.startsWith('WINNING'));
  const sunny = filtered.filter(s => s.name.startsWith('SUNNY') && s.name !== 'SUNNY SAILOR');
  const other = filtered.filter(s => !s.name.startsWith('WINNING') && !s.name.startsWith('SUNNY'));
  
  let html = '';
  
  function sec(title, ships) {
    if (!ships.length) return '';
    let s = '<div class="ship-cat-title">' + title + ' <span style="font-weight:400;font-size:12px;color:var(--text-light)">(' + ships.length + '艘)</span></div>';
    s += '<div class="ship-grid">';
    ships.forEach(sh => {
      s += '<div class="ship-card" onclick="toggleShipDetail(this,\'' + sh.name.replace(/'/g, "\\'") + '\')">';
      s += '<h4>' + sh.name + ' <span>' + sh.count + '份文件</span></h4>';
      s += '<div class="certs">';
      (sh.certs || []).slice(0, 6).forEach(c => { s += '<span>' + c + '</span>'; });
      if ((sh.certs || []).length > 6) s += '<span>+更多</span>';
      s += '</div>';
      s += '<div class="ship-detail" id="detail-' + sh.name.replace(/[ .]+/g, '_') + '"></div>';
      s += '</div>';
    });
    s += '</div>';
    return s;
  }
  
  html += sec('WINNING 系列', winning);
  html += sec('SUNNY 系列', sunny);
  html += sec('其他', other);
  
  list.innerHTML = html;
}

function toggleShipDetail(el, shipName) {
  el.classList.toggle('expanded');
  if (el.classList.contains('expanded')) {
    const detailId = 'detail-' + shipName.replace(/[ .]+/g, '_');
    const detailEl = document.getElementById(detailId);
    if (detailEl && detailEl.innerHTML === '') {
      loadShipDetail(shipName, detailEl);
    }
  }
}

function loadShipDetail(shipName, el) {
  const byShip = (STATE.shipKnowledge && STATE.shipKnowledge.by_ship) || {};
  const docs = byShip[shipName] || [];
  if (docs.length === 0) {
    el.innerHTML = '<div class="empty-fleet"><p>暂无详细数据</p></div>';
    return;
  }
  let html = '';
  docs.slice(0, 30).forEach(d => {
    const urgent = d.expiry && (d.expiry.includes('2024') || d.expiry.includes('2025-01') || d.expiry.includes('2025-02') || d.expiry.includes('2025-03'));
    html += '<div class="ship-detail-item">';
    html += '<b>' + (d.cert || d.file.slice(0,30)) + '</b>';
    if (d.expiry) html += '<span class="exp ' + (urgent ? 'urgent' : '') + '">⏱ ' + d.expiry + '</span>';
    html += '<div style="font-size:11px;color:#888;margin-top:2px">' + d.file.slice(0,50) + '</div>';
    html += '</div>';
  });
  if (docs.length > 30) html += '<div style="text-align:center;padding:8px;color:#999;font-size:12px">... 还有 ' + (docs.length-30) + ' 条记录</div>';
  el.innerHTML = html;
}

// 技术资料按设备类型分成多个小文件，只加载用户搜索的类别
var STATE_TECH_INDEX = null;
var TECH_SHARD_CACHE = {};

async function loadTechKnowledge() {
  try {
    // 先加载索引（~70KB），不加载全量数据
    const resp = await fetch('data/tech_index.json?_t=' + Date.now());
    STATE_TECH_INDEX = await resp.json();
    STATE.techKnowledge = { documents: {}, statistics: STATE_TECH_INDEX };
    renderTechKnowledge('');
  } catch(e) {
    const el = document.getElementById('techContent');
    if (el) el.innerHTML = '<div class="empty-fleet"><p>⚠️ 索引加载失败: ' + e.message + '</p></div>';
  }
}

function getDeviceFromQuery(q) {
  // 先从keyword_map找
  var km = STATE_TECH_INDEX.keyword_map || {};
  for (var kw in km) {
    if (q.includes(kw)) return km[kw];
  }
  // 从word_index找
  var wi = STATE_TECH_INDEX.word_index || {};
  for (var w in wi) {
    if (q.includes(w) && wi[w].length === 1) return wi[w][0];
  }
  return null;
}

async function loadTechShard(deviceName) {
  var shard = STATE_TECH_INDEX.device_shards[deviceName];
  if (!shard) return {};
  var url = 'data/' + shard.file + '?_t=' + Date.now();
  try {
    var resp = await fetch(url);
    var data = await resp.json();
    TECH_SHARD_CACHE[deviceName] = data;
    return data;
  } catch(e) {
    return {};
  }
}

async function renderTechKnowledge(searchText) {
  const list = document.getElementById('techContent');
  const statBar = document.getElementById('techStatBar');
  
  if (!STATE_TECH_INDEX) {
    list.innerHTML = '<div class="fleet-loading"><div class="dot-pulse"></div><span>加载技术资料索引...</span></div>';
    return;
  }
  
  const st = (searchText || '').toUpperCase();
  
  if (!st) {
    // 无搜索：显示分类统计
    let html = '<div class="tech-categories">';
    html += '<h3>📂 技术资料分类浏览</h3>';
    html += '<div class="category-grid">';
    var shards = STATE_TECH_INDEX.device_shards || {};
    for (var device in shards) {
      var info = shards[device];
      html += '<div class="category-card" onclick="searchTech(\'' + escHtml(device) + '\')">';
      html += '<h4>' + escHtml(device) + '</h4>';
      html += '<span>' + info.count + ' 份文档</span>';
      var sizeKB = Math.round(info.size / 1024);
      html += '<small>' + sizeKB + ' KB</small>';
      html += '</div>';
    }
    html += '</div></div>';
    list.innerHTML = html;
    if (statBar) statBar.innerHTML = '<span>📚 共 ' + STATE_TECH_INDEX.num_docs + ' 份技术资料（分片加载）</span>';
    return;
  }
  
  // 有搜索：先确定类别
  var device = getDeviceFromQuery(st);
  
  if (!device && STATE_TECH_INDEX) {
    // 无匹配类别，搜索所有分片文件名
    device = '_其他';
  }
  
  if (!device || !STATE_TECH_INDEX.device_shards[device]) {
    list.innerHTML = '<p>未找到匹配的技术资料</p>';
    return;
  }
  
  // 异步加载该分片
  list.innerHTML = '<div class="fleet-loading"><div class="dot-pulse"></div><span>加载 ' + device + ' 技术资料...</span></div>';
  
  var shardData = TECH_SHARD_CACHE[device];
  if (!shardData) {
    shardData = await loadTechShard(device);
  }
  
  var docs = shardData || {};
  var html = '';
  var count = 0;
  var seen = {};
  
  for (var id in docs) {
    if (Object.keys(seen).length > 100) break;
    var d = docs[id];
    var fn = (d.filename || '').toUpperCase();
    var md = (d.llm_md || '').slice(0, 100).toUpperCase();
    
    // 过滤
    if (!fn.includes(st) && !md.includes(st)) continue;
    
    var key = d.filename + (d.llm_md || '').slice(0, 50);
    if (seen[key]) continue;
    seen[key] = 1;
    count++;
    
    var mdPreview = (d.llm_md || '').replace(/\n/g, ' ').slice(0, 150);
    html += '<div class="tech-card">';
    html += '<h5>' + (d.filename || '未命名') + '</h5>';
    html += '<p class="preview">' + escHtml(mdPreview) + '</p>';
    html += '<div class="info">';
    var mdPreview = (d.llm_md || '').replace(/\n/g, ' ').slice(0, 150);
    html += '<div class="tech-card">';
    html += '<h5>' + (d.filename || '未命名') + '</h5>';
    html += '<p class="preview">' + escHtml(mdPreview) + '</p>';
    html += '<div class="info">';
    if (d.categories) html += '📂 ' + (Array.isArray(d.categories) ? d.categories.join(', ') : d.categories);
    if (d.ship_name) html += ' | 🚢 ' + d.ship_name;
    html += '</div>';
    html += '</div>';
  }
  
  if (!html) html = '<div class="empty-fleet"><p>📂 已加载 ' + Object.keys(docs).length + ' 份技术资料。在搜索框输入设备名称（如：锅炉、主机、发电机）查找，或到聊天对话框提问。</p></div>';
  else {
    html = '<div class="ship-stat-bar"><span class="ship-stat total">📄 ' + count + ' 条匹配（共' + Object.keys(docs).length + '份资料）</span></div>' + html;
  }
  list.innerHTML = html;
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getStatusClass(s) {
  if (s === '锚泊') return 'anchor';
  if (s === '系泊') return 'moored';
  return 'sea';
}

function renderFleet() {
  if (!STATE.fleetData) return;
  const container = document.getElementById('fleetContent');
  const search = document.getElementById('fleetSearchInput');
  const searchText = search ? search.value.toLowerCase().trim() : '';
  
  let vessels = STATE.fleetData.vessels || [];
  let filtered = vessels.filter(v => {
    if (STATE.fleetFilter !== 'all' && getStatusClass(v.status) !== STATE.fleetFilter) return false;
    if (searchText && !v.name.toLowerCase().includes(searchText) && !(v.destination||'').toLowerCase().includes(searchText)) return false;
    return true;
  });

  const winning = filtered.filter(v => v.name.startsWith('WINNING'));
  const sunny = filtered.filter(v => v.name.startsWith('SUNNY'));

  // 只更新船舶列表部分，不重建头部和搜索框
  let listHtml = '';

  function sec(title, vs) {
    let s = `<div class="fleet-section"><h4>${title} <span>(${vs.length}艘)</span></h4>`;
    vs.forEach(v => {
      const sc = getStatusClass(v.status);
      const overdue = v.eta && v.eta < '2026-05-01';
      const area = getShipLocation(v);
      s += `<div class="fleet-card" onclick="this.classList.toggle('expanded')">
        <div class="fleet-row">
          <span class="fleet-name">${v.name}</span>
          <span class="fleet-status-badge ${sc}">${v.status==='在航'?'🟢':v.status==='锚泊'?'🟡':'🔴'} ${v.status}</span>
          <span class="fleet-location">📍 ${area}</span>
          ${v.speed_kn ? `<span class="fleet-speed">${v.speed_kn}kn</span>` : ''}
          ${v.destination ? `<span class="fleet-dest">→ <b>${v.destination}</b></span>` : ''}
          ${v.eta ? `<span class="fleet-eta ${overdue?'overdue':''}">ETA ${v.eta}</span>` : ''}
        </div>
        <div class="fleet-details">
          ${v.lat ? `<span>🌐 ${v.lat.toFixed(2)}, ${v.lon.toFixed(2)}</span>` : ''}
          ${v.heading_deg ? `<span>🧭 ${v.heading_deg}°</span>` : ''}
          ${v.draught_m ? `<span>📏 ${v.draught_m}m</span>` : ''}
          ${v.mmsi ? `<span>📡 ${v.mmsi}</span>` : ''}
          ${v.imo ? `<span>🆔 ${v.imo}</span>` : ''}
          ${v.updateTime ? `<span>⏱ ${v.updateTime}</span>` : ''}
        </div>
      </div>`;
    });
    s += '</div>';
    return s;
  }

  if (winning.length) listHtml += sec('WINNING 系列', winning);
  if (sunny.length) listHtml += sec('SUNNY 系列', sunny);
  if (!filtered.length) listHtml += '<div class="empty-fleet"><p>没有匹配的船舶</p></div>';

  // 找到或创建列表容器
  let listEl = document.getElementById('fleetList');
  if (!listEl) {
    listEl = document.createElement('div');
    listEl.id = 'fleetList';
    // 插入到搜索框后面
    const filterEl = container.querySelector('.fleet-filter');
    if (filterEl) filterEl.after(listEl);
    else container.appendChild(listEl);
  }
  listEl.innerHTML = listHtml;
}

async function sendMessage() {
  const text = els.input.value.trim();
  if (!text && !STATE.imageData) return;
  if (STATE.isProcessing) return;
  if (text.length > 10000) {
    addMessage({ role: 'assistant', text: '⚠️ 消息过长，请将问题控制在10000字符以内' });
    return;
  }
  
  STATE.isProcessing = true;
  els.sendBtn.disabled = true;
  
  // 自动加载知识库（首次查询或跨模块场景）- 非阻塞
  if (STATE.currentModule === 'ships' && !STATE.shipKnowledge) {
    try { await loadShipKnowledge(); } catch(e) { console.error(e); }
  } else if (STATE.currentModule === 'tech' && !STATE_TECH_INDEX) {
    try { await loadTechKnowledge(); } catch(e) { console.error(e); }
  }
  
  els.welcome.classList.add('hidden');
  
  const userMsg = { role: 'user', text: text, image: STATE.imageData };
  addMessage(userMsg);
  
  els.input.value = '';
  els.input.style.height = 'auto';
  
  els.loading.classList.remove('hidden');
  scrollToBottom();
  
  try {
    const response = await callAPI(text, STATE.currentModule, STATE.imageData);
    els.loading.classList.add('hidden');
    addMessage({ role: 'assistant', text: response.reply });
    saveHistory(text, response.reply);
    if (STATE.imageData) STATE.imageData = null;
  } catch (err) {
    els.loading.classList.add('hidden');
    addMessage({ role: 'assistant', text: `⚠️ 抱歉，请求失败了：${err.message || '网络错误，请稍后重试'}` });
  }
  
  STATE.isProcessing = false;
  els.sendBtn.disabled = false;
  scrollToBottom();
}

// 以下函数保留用于前端展示（船舶列表面板、技术知识展示），不再用于AI对话context

function buildShipsContext(message) {
  const byShip = STATE.shipKnowledge.by_ship;
  if (!byShip) return null;
  
  const q = message.toUpperCase();
  
  // 先检查统计类问题（有几条船、总证书数），直接传答案不走AI
  const statsPatterns = ['几条船', '几艘船', '总共多少', '总数', '几有', '多少条', '多少艘', '船舶数量', '船舶总数'];
  for (let p of statsPatterns) {
    if (q.includes(p)) {
      let shipCount = Object.keys(byShip).length;
      let certCount = STATE.shipKnowledge.total_certs || 0;
      let ships = Object.keys(byShip).sort();
      let shipList = ships.join('、');
      let context = '以下是从船舶知识库中检索到的船舶统计信息：\n\n';
      context += '【船舶总数】' + shipCount + ' 条船\n';
      context += '【证书总数】约 ' + certCount + ' 份\n\n';
      context += '船舶列表（共 ' + shipCount + ' 条）：\n';
      // 分WINNING和SUNNY系列显示
      let winning = ships.filter(s => s.startsWith('WINNING'));
      let sunny = ships.filter(s => s.startsWith('SUNNY'));
      context += 'WINNING系列（' + winning.length + ' 条）：' + winning.join('、') + '\n\n';
      context += 'SUNNY系列（' + sunny.length + ' 条）：' + sunny.join('、') + '\n\n';
      return context;
    }
  }
  
  // 1. 尝试精确匹配船名
  let matchedShip = Object.keys(byShip).find(name => q.includes(name));
  
  // 2. 模糊匹配：找q中含有的船名关键词
  if (!matchedShip) {
    const allNames = Object.keys(byShip);
    // 按名字长度降序排序（长名更精确），找包含在q中的
    const sorted = [...allNames].sort((a, b) => b.length - a.length);
    matchedShip = sorted.find(name => {
      // 取船名前半部分（不含'SUNNY' 'WINNING'等前缀后的具体名）
      const short = name.replace(/^(WINNING|SUNNY)\s+/i, '');
      return q.includes(short);
    });
  }
  
  // 3. 按证书类型匹配
  let matchedCertType = null;
  if (!matchedShip) {
    // 遍历所有船，看证书名是否包含q中的关键词
    for (const [name, certs] of Object.entries(byShip)) {
      for (const c of certs) {
        const certUpper = (c.cert || '').toUpperCase();
        const fileName = (c.file || '').toUpperCase();
        if (certUpper.includes(q) || fileName.includes(q)) {
          matchedShip = name;
          matchedCertType = c.cert;
          break;
        }
      }
      if (matchedShip) break;
    }
  }
  
  if (!matchedShip) return null;
  
  const certs = byShip[matchedShip];
  if (!certs || certs.length === 0) return null;
  
  // 构建context：只放文档原文，不放约束指令（Worker端会统一处理约束）
  let context = `以下是从船舶知识库中检索到的 "${matchedShip}" 相关文档内容：\n\n`;
  
  // 如果匹配了特定证书类型，只输出该类型
  if (matchedCertType) {
    const matched = certs.filter(c => c.cert === matchedCertType);
    if (matched.length > 0) {
      context += `【证书类型：${matchedCertType}】\n`;
      matched.forEach((c, i) => {
        if (c.expiry && c.expiry !== '未明确提及' && c.expiry !== '未明确标注有效期') {
          context += `到期日：${c.expiry}\n`;
        }
        if (c.md) {
          const mdText = c.md.replace(/^#+\s/gm, '').slice(0, 3000);
          context += `${mdText}\n\n`;
        }
      });
    }
  } else {
    // 输出该船所有证书的md（限于5条以内，避免token过长）
    const LIMIT = 5;
    const toShow = certs.slice(0, LIMIT);
    toShow.forEach((c) => {
      context += `【${c.cert || '证书'}】`;
      if (c.expiry && c.expiry !== '未明确提及' && c.expiry !== '未明确标注有效期') {
        context += `（到期日：${c.expiry}）`;
      }
      context += `\n`;
      if (c.md) {
        const mdText = c.md.replace(/^#+\s/gm, '').slice(0, 2000);
        context += `${mdText}\n\n`;
      }
    });
    if (certs.length > LIMIT) {
      context += `...（该船还有 ${certs.length - LIMIT} 份证书，如需查看请具体提问）\n`;
    }
  }
  
  return context;
}

    systemContent += '\n\n【⚠️ 关键约束】当前问题已附知识库检索结果。必须严格基于该结果回答，不添加原文中没有的信息。没有的信息回答「未找到」。';
  }
  
  var messages = [
    { role: 'system', content: systemContent },
    ...lastHistory,
    { role: 'user', content: userContent }
  ];
  
  // ═══ 图片处理 ═══
  var model = APIYI_TEXT_MODEL;
  if (imageData) {
    model = APIYI_VISION_MODEL;
    messages = [
      { role: 'system', content: systemContent },
      { role: 'user', content: [{ type: 'image_url', image_url: { url: imageData } }, { type: 'text', text: message }] }
    ];
  }
  
  // 🐛 DEBUG: 打印实际发送的消息结构
  console.log('[DEBUG] system prompt last 300:', systemContent.substring(systemContent.length - 300));
  console.log('[DEBUG] user content first 200:', userContent.substring(0, 200));
  console.log('[DEBUG] model:', model);
  
  // ═══ 调API易 ═══
  const response = await fetch(APIYI_BASE + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + APIYI_KEY },
    body: JSON.stringify({ model, messages, temperature: 0.01, max_tokens: 4096, stream: false })
  });
  
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${response.status}`);
  }
  
  const data = await response.json();
  console.log('[DEBUG] API reply (first 200 chars):', data.choices[0].message.content.substring(0, 200));
  return { reply: data.choices[0].message.content, model: data.model, usage: data.usage };
}

// 前端知识库检索
async function buildFrontendContext(message, module) {
  const q = (message || '').toUpperCase();
  
  // 船舶模块
  if (module === 'ships' && STATE.shipKnowledge) {
    const byShip = STATE.shipKnowledge.by_ship;
    if (byShip) {
      // 统计类问题（有几条船、总证书数）
      var statsPats = ['几条船', '几艘船', '总共多少', '总数', '几有', '多少条', '多少艘', '船舶数量', '船舶总数'];
      for (var p2 of statsPats) {
        if (q.includes(p2)) {
          let sCount = Object.keys(byShip).length;
          let cCount = STATE.shipKnowledge.total_certs || 0;
          let list = Object.keys(byShip).sort();
          let ctx = '【知识库检索结果 — 船队概况】\n\n';
          ctx += '船舶总数：' + sCount + ' 条船\n';
          ctx += '已上传证书总数：' + cCount + ' 份\n\n';
          let w = list.filter(s => s.startsWith('WINNING'));
          let sn = list.filter(s => s.startsWith('SUNNY'));
          ctx += 'WINNING系列（' + w.length + ' 条）：' + w.join('、').slice(0, 300) + '\n\n';
          ctx += 'SUNNY系列（' + sn.length + ' 条）：' + sn.join('、').slice(0, 300) + '\n\n';
          return ctx;
        }
      }

      let matchedShip = Object.keys(byShip).find(name => q.includes(name));
      if (!matchedShip) {
        const sorted = Object.keys(byShip).sort((a, b) => b.length - a.length);
        matchedShip = sorted.find(name => {
          const short = name.replace(/^(WINNING|SUNNY)\s+/i, '');
          return q.includes(short);
        });
      }

      if (matchedShip) {
        const certs = byShip[matchedShip];
        // 先输出有明确到期日的，再输出其他的
        var validCerts = [];
        var otherCerts = [];
        for (var ct of certs) {
          var ex = ct.expiry || '';
          if (ex && ex !== '未明确提及' && ex !== '未明确标注有效期' && ex !== '未明确显示' && ex !== '未明确说明' && ex !== '无' && !ex.startsWith('未')) {
            validCerts.push(ct);
          } else if (ct.cert && ct.cert !== '(未分类)' && ct.cert !== '') {
            otherCerts.push(ct);
          }
        }
        // 优先展示有期限的
        var sorted = validCerts.concat(otherCerts).slice(0, 60);
        var ctx = '【知识库检索结果 — ' + matchedShip + '】\n该船共有 ' + certs.length + ' 份证书记录，以下是部分列表：\n\n';
        sorted.slice(0, 60).forEach(function(c) {
          ctx += '• ' + (c.cert || '证书');
          var ex = c.expiry || '';
          if (ex && ex !== '未明确提及' && ex !== '未明确标注有效期' && ex !== '未明确显示' && ex !== '未明确说明' && ex !== '无' && !ex.startsWith('未')) {
            ctx += '（到期日：' + ex + '）';
          }
          ctx += '\n';
        });
        if (certs.length > 60) ctx += '\n...（该船共 ' + certs.length + ' 份证书，未全部展示）';
        return ctx;
      }
      
      // 按证书类型/到期日关键词搜索（非船名查询场景）
      var certTypePats = ['证书', '到期', '到期日', 'DOCK', 'SURVEY', '舱室', 'ILL', 'IOPP', 'SMC', 'ISSC', 'SSEC', 'SC', 'SE', 'SR', 'IAPP'];
      var isCertQuery = false;
      for (var cp of certTypePats) {
        if (q.includes(cp)) { isCertQuery = true; break; }
      }
      if (isCertQuery) {
        var certMatches = [];
        var isFullListQuery = /各船有哪些证书|列出.*[所全]有.*证书|所有船.*证书|全部船.*证书/.test(q);
        if (isFullListQuery) {
          // 用户要全量清单 → 输出每条船的证书数量+类型概览（去重）
          var ctx = '【知识库检索结果 — 全船队证书清单】\n以下为每艘船的证书类型（已去重）及数量。请基于此数据回答用户问题。\n\n';
          for (var sn of Object.keys(byShip).sort()) {
            var certsForShip = byShip[sn] || [];
            var uniqueTypes = {};
            for (var ct of certsForShip) {
              var cn = ct.cert || '(未分类)';
              uniqueTypes[cn] = (uniqueTypes[cn] || 0) + 1;
            }
            var typeKeys = Object.keys(uniqueTypes).slice(0, 12);
            var typeStr = typeKeys.map(function(tk) {
              var extra = uniqueTypes[tk] > 1 ? '(' + uniqueTypes[tk] + '份)' : '';
              return tk + extra;
            }).join('; ');
            if (Object.keys(uniqueTypes).length > 12) {
              typeStr += '...(+' + (Object.keys(uniqueTypes).length - 12) + '种)';
            }
            ctx += sn + ': ' + certsForShip.length + '份证书记录 — ' + typeStr + '\n';
          }
          ctx += '\n⚠️ 每艘船只展示前12种证书类型（含重复），完整列表请具体询问某条船。';
          return ctx.slice(0, 16000);
        }
        for (var sn of Object.keys(byShip).sort()) {
          for (var ct of (byShip[sn] || [])) {
            var cn = (ct.cert || '').toUpperCase();
            var ex = (ct.expiry || '').toUpperCase();
            if (cn.includes(q) || ex.includes(q)) {
              certMatches.push({ ship: sn, cert: ct.cert, expiry: ct.expiry });
              break;
            }
          }
          if (certMatches.length >= 5) break;
        }
        if (certMatches.length > 0) {
          var ctx = '【知识库检索结果 — 按关键词匹配证书】\n共找到 ' + certMatches.length + ' 条匹配记录：\n\n';
          certMatches.forEach(function(m) {
            ctx += '• ' + m.ship + ' — ' + m.cert;
            if (m.expiry) ctx += '（到期日：' + m.expiry + '）';
            ctx += '\n';
          });
          return ctx;
        }
      }

      // 没匹配到具体船只 → 返回完整船队索引，让AI自行查找
      var idxParts = [];
      for (var sn of Object.keys(byShip).sort()) {
        var certList = [];
        for (var ct of (byShip[sn] || []).slice(0, 8)) {
          var cn = ct.cert || '(未分类)';
          var ex = ct.expiry || '';
          if (ex && ex !== '未明确提及' && ex !== '未明确标注有效期' && ex !== '未明确显示' && ex !== '未明确说明' && ex !== '无' && !ex.startsWith('未')) {
            certList.push(cn + '(' + ex + ')');
          } else if (cn !== '(未分类)') {
            certList.push(cn);
          }
        }
        if (certList.length > 0) idxParts.push(sn + ': ' + certList.join('; '));
      }
      if (idxParts.length > 0) {
        var ctx = '【完整船舶证书索引（共' + idxParts.length + '艘）】\n\n请从下方索引中查找用户问题涉及的船名、证书名或到期日。如果找到，请基于索引内容回答。如果索引中没有相关信息，请如实说未找到。\n\n';
        ctx += idxParts.join('\n---\n').slice(0, 14000);
        return ctx;
      }
    }
  }
  
  // 技术模块
  if (module === 'tech' && STATE_TECH_INDEX) {
    var device = getDeviceFromQuery(q);
    if (device && STATE_TECH_INDEX.device_shards[device]) {
      var shardData = TECH_SHARD_CACHE[device];
      if (!shardData) shardData = await loadTechShard(device);
      if (shardData) {
        var docs = Object.values(shardData).filter(d => {
          var fn = (d.filename || '').toUpperCase();
          var md = (d.llm_md || '').slice(0, 200).toUpperCase();
          return fn.includes(q) || md.includes(q);
        }).slice(0, 5);
        if (docs.length > 0) {
          var ctx = '【知识库检索结果 — 技术资料】\n共找到 ' + docs.length + ' 份相关文档：\n\n';
          docs.forEach(d => {
            ctx += '• ' + (d.filename || '未命名');
            if (d.llm_md) ctx += '\n  ' + d.llm_md.replace(/\n/g, ' ').slice(0, 200);
            ctx += '\n';
          });
          return ctx;
        }
      }
    }
  }
  
  // ===== 法规模块查询分类器 =====
  // 注入【法规问题类型】标签，引导AI按模板回答
  if (module === 'regulations') {
    var qc = message;
    var typeLabel = '';
    
    // TYPE1 条款解读
    var type1Pats = [/条款.*意思|条款.*解释|条款.*含义|条款.*解读|条款.*要求|条款.*适用|条款.*范围|什么意思|含义是|解释一下.*条款|§[\d\.]+|REG\s*\.?\s*\d/i];
    for (var t1 of type1Pats) {
      if (t1.test(qc)) { typeLabel = '【法规问题类型: TYPE1】\n用户想了解某公约条款的具体含义和适用范围。请按TYPE1模板回答：先写出公约名和条款号，再解释含义和适用范围，再分析对散货船的特殊要求。\n\n'; break; }
    }
    
    // TYPE2 实操合规
    if (!typeLabel) {
      var type2Pats = [/可以.*排放|排放.*可以|可以.*处理|没有处理|未经处理|不符合|是否合规|是否符合|是否可以|能不能|能否|允许.*吗|允许排放|符合要求|达标|合法|排污|排放.*标准|排放.*要求|排放.*规定|压载水.*排放|排放.*压载水/i];
      for (var t2 of type2Pats) {
        if (t2.test(qc)) { typeLabel = '【法规问题类型: TYPE2】\n用户问某个操作是否符合法规。请参照模板中TYPE2的完整示例格式回答：第一句直接写结论，然后逐条引用条款号并解释，再分析WINNING散货船队适用性，最后给实操步骤。\n\n'; break; }
      }
    }
    
    // TYPE3 PSC检查
    if (!typeLabel) {
      var type3Pats = [/PSC|港口国|检查.*注意|检查.*准备|检查.*要点|常见缺陷|检查.*缺陷|检查.*重点|东京备忘录|巴黎备忘录|TOKYO.*MOU|PARIS.*MOU|USCG|检查官|滞留|准备.*检查|缺陷.*清单/i];
      for (var t3 of type3Pats) {
        if (t3.test(qc)) { typeLabel = '【法规问题类型: TYPE3】\n用户准备PSC检查或查询常见缺陷。请按TYPE3模板回答：先检查概要，再分项详解，再应对措施。\n\n'; break; }
      }
    }
    
    // TYPE4 新规动态
    if (!typeLabel) {
      var type4Pats = [/新规|最新|修正案|新要求|MEPC\s*\d+|MSC\s*\d+|决议|新标准|即将生效|最新动态|新公约|MEPC\.\d+|MSC\.\d+|IMO.*新|新决议/i];
      for (var t4 of type4Pats) {
        if (t4.test(qc)) { typeLabel = '【法规问题类型: TYPE4】\n用户问最新IMO修正案或即将生效的新规。请按TYPE4模板回答：先概要（决议编号+生效日期），再核心变化，再对WINNING船队的影响。\n\n'; break; }
      }
    }
    
    // TYPE5 证书/检验
    if (!typeLabel) {
      var type5Pats = [/证书.*检验|检验.*周期|检验.*要求|换证|发证|证书.*要求|证书.*到期|特检|坞检|年检|中间检验|初次检验|定期检验|年度检验|特别检验|检验.*间隔/i];
      for (var t5 of type5Pats) {
        if (t5.test(qc)) { typeLabel = '【法规问题类型: TYPE5】\n用户问某证书的检验要求或换证周期。请按TYPE5模板回答：先证书概述，再检验要求，再WINNING船队适用情况。\n\n'; break; }
      }
    }
    
    // TYPE7 公约概述
    if (!typeLabel) {
      var type7Pats = [/什么是.*[公约协议职责Code规则细则]|公约.*内容|公约.*概要|公约.*介绍|公约.*结构|公约.*组成|公约.*包含|公约.*章节|主要内容|公约.*是什么|有哪些.*公约|公约.*目录|公约.*框架|公约.*整体|公约.*概述|公约体系/i];
      for (var t7 of type7Pats) {
        if (t7.test(qc)) { typeLabel = '【法规问题类型: TYPE7】\n用户想了解某公约的总体框架和主要内容。回答结构：先概述公约定位/通过年份/修正次数，再按章节/附则列出核心内容，再说明与散货船的相关性。最后附IMO链接和免责。\n\n'; break; }
      }
    }
    
    // TYPE8 对比分析
    if (!typeLabel) {
      var type8Pats = [/对比|区别|差异|不同|比较|哪个.*更|vs|VS|与.*区别|与.*差异|和.*不同|新旧.*对比|和.*有什么.*不同/i];
      for (var t8 of type8Pats) {
        if (t8.test(qc)) { typeLabel = '【法规问题类型: TYPE8】\n用户问新旧规则或不同规范之间的对比。回答结构：先列出对比维度表格，再逐项说明差异，再给出对WINNING船队的影响。附IMO链接和免责。\n\n'; break; }
      }
    }
    
    // 没有匹配 → TYPE9 一般问答
    if (!typeLabel) {
      typeLabel = '【法规问题类型: TYPE9】\n这是一般性法规问题，不属于特定模板的范畴。请根据内容直接回答，但必须引用精确条款号，回答末尾标注免责。\n\n';
    }
    
    // 只注入类型标签，法规模块不需要【知识库检索结果】标记
    return typeLabel;
  }
  
  return null;
}

// ====== 消息渲染 ======
function addMessage(msg) {
  const div = document.createElement('div');
  div.className = `message ${msg.role}`;
  const avatar = msg.role === 'user' ? '👤' : '🤖';
  let content = '';
  if (msg.image) content += `<img src="${msg.image}" class="image-attachment" alt="上传图片">`;
  if (msg.text) content += formatMessage(msg.text);
  div.innerHTML = `<div class="message-avatar">${avatar}</div><div class="message-content">${content}</div>`;
  els.messages.appendChild(div);
  scrollToBottom();
}

function formatMessage(text) {
  if (!text) return '';
  let html = text;
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 【法规条款→可点击查看原文】
  // 使用 RegulationsMap 将法规条款名称转换为可点击链接
  if (typeof window.RegulationsMap !== 'undefined' && window.RegulationsMap.htmlify) {
    var regHtml = window.RegulationsMap.htmlify(text);
    if (regHtml) {
      html = regHtml;
    }
  }
  const paragraphs = html.split('\n\n');
  html = paragraphs.map(p => {
    const trimmed = p.trim();
    if (!trimmed) return '';
    if (trimmed.match(/^[\-\*]\s/m)) {
      const items = trimmed.split('\n').filter(l => l.match(/^[\-\*]\s/));
      return '<ul>' + items.map(i => `<li>${i.replace(/^[\-\*]\s/, '')}</li>`).join('') + '</ul>';
    }
    if (trimmed.match(/^\d+\.\s/m)) {
      const items = trimmed.split('\n').filter(l => l.match(/^\d+\.\s/));
      return '<ol>' + items.map(i => `<li>${i.replace(/^\d+\.\s/, '')}</li>`).join('') + '</ol>';
    }
    if (trimmed.startsWith('>')) {
      return `<blockquote>${trimmed.replace(/^>\s?/gm, '').replace(/\n/g, '<br>')}</blockquote>`;
    }
    return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return html;
}

function saveHistory(userText, assistantText) {
  const module = STATE.currentModule;
  if (!STATE.conversationHistory[module]) STATE.conversationHistory[module] = [];
  STATE.conversationHistory[module].push(
    { role: 'user', text: userText, time: Date.now() },
    { role: 'assistant', text: assistantText, time: Date.now() }
  );
  if (STATE.conversationHistory[module].length > 20) {
    STATE.conversationHistory[module] = STATE.conversationHistory[module].slice(-20);
  }
  try { localStorage.setItem('wsai_history', JSON.stringify(STATE.conversationHistory)); } catch(e) {}
}

function renderMessages(module) {
  els.messages.innerHTML = '';
  const history = STATE.conversationHistory[module] || [];
  if (history.length === 0) { els.welcome.classList.remove('hidden'); return; }
  els.welcome.classList.add('hidden');
  history.forEach(msg => addMessage(msg));
  scrollToBottom();
}

function searchKnowledgeBaseOverlay(category, type) {
  const contentEl = document.getElementById('overlayContent');
  contentEl.innerHTML = '<div class=panel-placeholder><p>⏳ 加载中…</p></div>';
  
  const db = type === 'tech' ? STATE.techKnowledge : STATE.shipKnowledge;
  if (!db || !db.documents) {
    fetch('/api/data?list=' + (type || 'ship')).then(r => r.json()).then(data => {
      if (type === 'tech') STATE.techKnowledge = data;
      else STATE.shipKnowledge = data;
      renderToOverlay(category, type || 'ship', data);
    }).catch(function() {
      contentEl.innerHTML = '<div class=panel-placeholder><p>暂无内容</p></div>';
    });
    return;
  }
  renderToOverlay(category, type || 'ship', db);
}

function renderToOverlay(category, type, db) {
  const contentEl = document.getElementById('overlayContent');
  var docs = db.documents || {};
  var results = [];
  var seen = {};
  
  for (var id in docs) {
    var d = docs[id];
    var k = d.filename + (d.llm_md || '').slice(0, 80);
    if (seen[k]) continue;
    seen[k] = 1;
    results.push(d);
    if (results.length >= 100) break;
  }
  
  if (results.length === 0) {
    contentEl.innerHTML = '<div class=panel-placeholder><p>暂无数据</p></div>';
    return;
  }
  
  var h = '<div class=ship-stat-bar><span class=ship-stat total>📄 ' + results.length + ' 条</span></div>';
  h += '<div class=ship-grid>';
  results.forEach(function(d) {
    var md = d.llm_md || '';
    var preview = md.split('\\n').slice(0, 2).join(' | ');
    h += '<div class=ship-card onclick="this.classList.toggle(\'expanded\')"><h4>📄 ' + (d.filename || '?') + '</h4>';
    h += '<div class=certs><span>' + preview + '</span></div>';
    h += '<div class=ship-detail><p style=font-size:12px;color:var(--text-light)>' + md.slice(0, 300) + '</p></div>';
    h += '</div>';
  });
  h += '</div>';
  contentEl.innerHTML = h;
}

function renderShipCertificates(db) {
  const contentEl = document.getElementById('overlayContent');
  var docs = db.documents || {};
  
  var ships = {};
  for (var id in docs) {
    var d = docs[id];
    var fn = d.filename || '';
    var m = fn.match(/^(WINNING\s+\w+|SUNNY\s+\w+)/i);
    var s = m ? m[1].toUpperCase() : '其他';
    if (!ships[s]) ships[s] = [];
    var md = d.llm_md || '';
    var t = '文档';
    var exp = '';
    if (md) {
      var x = md.match(/文档类型[：:](.+)/);
      if (x) t = x[1].trim();
      x = md.match(/有效期[：:](.+)/);
      if (x) exp = x[1].trim();
    }
    ships[s].push({filename: d.filename || '?', type: t, expiry: exp});
  }
  
  var total = Object.values(ships).reduce(function(a, b) { return a + b.length; }, 0);
  var h = '<div class=ship-stat-bar><span class=ship-stat total>📄 ' + total + ' 份</span><span class=ship-stat>🚢 ' + Object.keys(ships).length + ' 艘</span></div>';
  
  var w = {}, su = {}, o = {};
  for (var s in ships) {
    if (s.startsWith('WINNING')) w[s] = ships[s];
    else if (s.startsWith('SUNNY')) su[s] = ships[s];
    else o[s] = ships[s];
  }
  
  function shipGroup(title, g) {
    var html = '<div class=ship-cat-title>' + title + '</div><div class=ship-grid>';
    for (var s in g) {
      var ct = g[s].map(function(d) { return d.type; }).filter(function(v, i, a) { return a.indexOf(v) === i; }).join(' · ');
      html += '<div class=ship-card onclick="this.classList.toggle(\'expanded\')"><h4>' + s + ' <span>(' + g[s].length + '份)</span></h4>';
      html += '<div class=certs><span>' + ct + '</span></div><div class=ship-detail>';
      g[s].forEach(function(d) {
        html += '<div class=ship-detail-item><b>' + d.filename + '</b>' + (d.expiry ? '<span class=exp>⏰ ' + d.expiry + '</span>' : '') + '</div>';
      });
      html += '</div></div>';
    }
    html += '</div>';
    return html;
  }
  
  if (Object.keys(w).length) h += shipGroup('WINNING 系列', w);
  if (Object.keys(su).length) h += shipGroup('SUNNY 系列', su);
  if (Object.keys(o).length) h += shipGroup('其他', o);
  contentEl.innerHTML = h;
}

    // 异步加载证书数据
    function updateCertStats(shipName) {
      if (certDb) {
        var certs = certDb[shipName] || [];
        var el = document.getElementById('cert-stat-' + shipName.replace(/\s/g,''));
        if (el) {
          var total = certs.length;
          var now = new Date();
          var nearExpiry = 0, expired = 0;
          certs.forEach(function(c) {
            var ex = (c.expiry || '').toString();
            if (ex) {
              var m = ex.match(/(20\d{2})/);
              if (m) {
                var y = parseInt(m[1]);
                if (y < now.getFullYear()) expired++;
                else if (y === now.getFullYear()) nearExpiry++;
              }
            }
          });
          var stats = '📄 ' + total + ' 份'; 
          if (nearExpiry > 0) stats += ' · 🟡 ' + nearExpiry + ' 今年到期';
          el.innerHTML = stats;
        }
      }
    }
    
    fetch('data/ship_knowledge.json').then(function(r) { return r.json(); }).then(function(data) {
      certDb = data.by_ship || data;
      STATE.shipByShip = certDb;
      s.forEach(function(x) { updateCertStats(x.name); });
    }).catch(function() {});
  });
}

// ── 前端海域/港口判断（与Python端一致）──
function getShipLocation(v) {
  if (v.lon == null || v.lat == null) return '—';
  var lon = v.lon, lat = v.lat, st = v.status;
  // 港口定义
  var ports = {
    '曹妃甸': {lo:118.2,hi:118.6,la:38.5,ha:39.1},
    '烟台':   {lo:121.1,hi:121.7,la:37.3,ha:37.9},
    '青岛':   {lo:120.0,hi:120.6,la:35.8,ha:36.3},
    '日照':   {lo:119.3,hi:119.7,la:35.0,ha:35.5},
    '防城港': {lo:108.1,hi:108.6,la:21.3,ha:21.8},
    '湛江':   {lo:110.2,hi:110.6,la:21.0,ha:21.4},
    '新加坡': {lo:103.5,hi:104.0,la:1.0, ha:1.5},
    '博凯港': {lo:-15.0,hi:-14.5,la:10.0,ha:11.0},
    '博法港': {lo:-13.9,hi:-13.4,la:9.0, ha:9.6},
  };
  // 精确匹配港口
  for (var name in ports) {
    var p = ports[name];
    if (p.lo <= lon && lon <= p.hi && p.la <= lat && lat <= p.ha) return name;
  }
  // 系泊/锚泊：扩大范围
  if (st === '系泊' || st === '锚泊') {
    for (var name in ports) {
      var p = ports[name];
      if ((p.lo-2) <= lon && lon <= (p.hi+2) && (p.la-1) <= lat && lat <= (p.ha+1)) return name+'附近';
    }
  }
  // 海域定义
  var seas = [
    ['渤海', 117,122,37,41],['黄海', 119,126,33,37],
    ['东海', 117,127,25,33],['台湾海峡',117,121,22,26],
    ['南海(近赤道)',106,122,-4,-2],['南海',106,122,-2,22],
    ['马六甲海峡',100,106,1,6],['巽他海峡附近',103,108,-8,-5],
    ['印度洋(东部)',78,100,-15,15],['印度洋(中部)',50,78,-30,15],
    ['印度洋(西部)',20,50,-35,15],['印度洋(东南部)',78,100,-30,-15],
    ['好望角近岸',14,20,-35,-32],['南大西洋(西非近岸)',-20,10,-30,-5],
    ['几内亚湾',-15,-2,-5,8],['北大西洋(非洲西北岸)',-20,-10,12,25],
  ];
  for (var i=0; i<seas.length; i++) {
    var s = seas[i];
    if (s[1] <= lon && lon <= s[2] && s[3] <= lat && lat <= s[4]) return s[0];
  }
  return '(' + Math.abs(lat).toFixed(0) + '°' + (lat>=0?'N':'S') + ' ' + Math.abs(lon).toFixed(0) + '°' + (lon>=0?'E':'W') + ')';
}

// ── 渲染覆盖面板船舶动态（含海域位置）──
function renderFleetInSub(d,c) {
  var v = d.vessels || [];
  v.forEach(function(x) { x._area = getShipLocation(x); });
  var se = v.filter(function(x){return x.status==='在航'}).length;
  var an = v.filter(function(x){return x.status==='锚泊'}).length;
  var mo = v.filter(function(x){return x.status==='系泊'}).length;
  var h = '<div class=fleet-header><h3>🚢 A.WINNING FLEET <span style=font-weight:400;font-size:12px;color:var(--text-light)>('+v.length+'艘)</span></h3><div class=fleet-stats><span class=fleet-stat sea>🟢 '+se+'</span><span class=fleet-stat anchor>🟡 '+an+'</span><span class=fleet-stat moored>🔴 '+mo+'</span></div></div>';
  h += '<div class=fleet-time>📡 '+(d.timestamp||'')+'</div>';

  function fl(f,sv){
    var r = v;
    if(f!=='all') r = r.filter(function(x){if(f==='sea') return x.status==='在航';if(f==='anchor') return x.status==='锚泊';return x.status==='系泊'});
    if(sv) r = r.filter(function(x){return x.name.toLowerCase().indexOf(sv.toLowerCase())!==-1 || (x.destination||'').toLowerCase().indexOf(sv.toLowerCase())!==-1});
    return r;
  }

  var ff = fl('all','');

  // 按钮
  var btns = [['all','全部',v.length],['sea','🟢 在航',se],['anchor','🟡 锚泊',an],['moored','🔴 系泊',mo]];
  h += '<div class=fleet-filter><span class=ship-count>' + v.length + '艘</span>';
  btns.forEach(function(x){h+='<button onclick="setFleetSubFilter(\''+x[0]+'\')" class="' + (x[0]==='all'?'active':'') + '">'+x[1]+' '+x[2]+'</button>'});
  h += '</div>';

  // 列出两条航线方向
  h += '<div style="font-size:11px;color:#888;margin:0 0 10px 12px;display:flex;gap:16px;flex-wrap:wrap">';
  h += '<span>⛴ 西行: 中国→博凯</span><span>⛴ 东行: 博凯→中国</span>';
  h += '</div>';

  // WINNING + SUNNY
  [['WINNING',ff.filter(function(x){return x.name.startsWith('WINNING')})],['SUNNY',ff.filter(function(x){return x.name.startsWith('SUNNY')})]].forEach(function(a){
    if(!a[1].length) return;
    h += '<div class=fleet-section><h4>'+a[0]+' <span>('+a[1].length+')</span></h4>';
    a[1].forEach(function(x){
      var sc = x.status==='在航'?'sea':x.status==='锚泊'?'anchor':'moored';
      var spd = x.speed_kn ? x.speed_kn+'kn' : '—';
      var area = x._area || '—';
      var dst = x.destination || '';
      var etaInfo = x.eta ? ' ETA '+x.eta : '';

      if (x.status === '系泊') {
        // 系泊：位置（港口）+ 下一港 + ETA
        var line2 = '📍 ' + area;
        if (dst) line2 += ' → 下一港 ' + dst;
        if (etaInfo) line2 += ' ' + etaInfo;
        h += '<div class=fleet-card style="cursor:default"><div class=fleet-row><span class=fleet-name>'+x.name+'</span><span class="fleet-status-badge '+sc+'">'+x.status+'</span><span class=fleet-location>'+line2+'</span></div></div>';
      } else {
        // 在航/锚泊
        var line2 = '📍 ' + area;
        if (x.status === '锚泊') {
          if (dst) line2 += ' → ' + dst;
        } else {
          line2 += ' | ' + spd;
          if (dst) line2 += ' → ' + dst;
        }
        if (etaInfo) line2 += ' ' + etaInfo;
        h += '<div class=fleet-card style="cursor:default"><div class=fleet-row><span class=fleet-name>'+x.name+'</span><span class="fleet-status-badge '+sc+'">'+x.status+'</span><span class=fleet-location>'+line2+'</span></div></div>';
      }
    });
    h += '</div>';
  });

  c.innerHTML = h;
}

function resolve(e) {
  if (!e) return null;
  return e.r ? (MAP[e.r] || null) : e;
}

function extractMatches(text) {
  var m = [];
  var keys = Object.keys(MAP).sort(function(a,b){return b.length-a.length;});
  for (var i=0;i<keys.length;i++) {
    var k = keys[i], idx = text.indexOf(k);
    if (idx === -1) continue;
    var pc = text[idx-1]||'', nc = text[idx+k.length]||'';
    if (!pc.match(/[a-zA-Z0-9]/) && (!nc.match(/[a-zA-Z0-9]/)||nc==='.'||nc==='-'||nc==='/')) {
      m.push({s:idx,e:idx+k.length,k:k,entry:MAP[k]});
    }
  }
  m.sort(function(a,b){return a.s-b.s;});
  var f = [];
  for (var i=0;i<m.length;i++) {
    var ov = false;
    for (var j=0;j<f.length;j++) {
      if (m[i].s < f[j].e && m[i].e > f[j].s) {
        if (m[i].k.length > f[j].k.length) f[j] = m[i];
        ov = true; break;
      }
    }
    if (!ov) f.push(m[i]);
  }
  return f;
}

window.htmlifyRegs = function(text) {
  var matches = extractMatches(text);
  if (matches.length === 0) return null;
  var result = text;
  matches.sort(function(a,b){return b.s-a.s;});
  for (var i=0;i<matches.length;i++) {
    var mt = matches[i];
    var res = resolve(mt.entry);
    if (!res) continue;
    var ref = text.substring(mt.s, mt.e);
    var link = '';
    if (res.f) {
      link = '<a href="javascript:void(0)" class="regulation-link" onclick="openRegulationPdf(\''+res.f.replace(/'/g,"\\'")+'\',\''+(res.l||'').replace(/'/g,"\\'")+'\')" title="点击查看 '+(res.l||ref)+'">'+ref+'<span class="law-icon">\uD83D\uDCC4</span></a>';
    } else if (res.u) {
      link = '<a href="'+res.u+'" target="_blank" rel="noopener" class="regulation-link" title="打开 '+(res.l||ref)+'">'+ref+'<span class="law-icon">\uD83D\uDD17</span></a>';
    } else { continue; }
    result = result.substring(0,mt.s) + link + result.substring(mt.e);
  }
  return result;
};
