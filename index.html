<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WINNING Shipping AI - 船舶智能合规平台</title>
<link rel="stylesheet" href="frontend/style.css">
<style>
/* ====== 船舶动态面板 ====== */
.fleet-panel { display: none; padding: 16px; height: 100%; overflow-y: auto; flex-direction: column; }
.fleet-panel.active { display: flex; }
.fleet-panel.hidden { display: none; }
.fleet-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.fleet-header h3 { font-size: 16px; color: var(--primary); margin: 0; }
.fleet-stats { display: flex; gap: 8px; font-size: 12px; }
.fleet-stat { padding: 2px 10px; border-radius: 12px; font-weight: 600; }
.fleet-stat.sea { background: #d4edda; color: #155724; }
.fleet-stat.anchor { background: #fff3cd; color: #856404; }
.fleet-stat.moored { background: #f8d7da; color: #721c24; }
.fleet-time { font-size: 11px; color: var(--text-light); margin-bottom: 8px; }
.fleet-filter { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.fleet-filter button { padding: 4px 12px; border-radius: 14px; border: 1px solid var(--border); background: white; font-size: 12px; cursor: pointer; transition: all .15s; }
.fleet-filter button:hover { border-color: var(--primary); }
.fleet-filter button.active { background: var(--primary); color: white; border-color: var(--primary); }
.fleet-filter button.active.sea-filter { background: #28a745; border-color: #28a745; }
.fleet-filter button.active.anchor-filter { background: #ffc107; color: #333; border-color: #ffc107; }
.fleet-filter button.active.moored-filter { background: #dc3545; border-color: #dc3545; }
.fleet-search { padding: 6px 14px; border: 1px solid var(--border); border-radius: 16px; font-size: 13px; outline: none; flex: 1; min-width: 120px; }
.fleet-search:focus { border-color: var(--primary); }
.fleet-section { margin-bottom: 16px; }
.fleet-section h4 { font-size: 14px; color: var(--text); padding-bottom: 4px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.fleet-section h4 span { font-weight: 400; font-size: 12px; color: var(--text-light); }
.fleet-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  padding: 10px 12px;
  cursor: pointer;
  transition: box-shadow .15s;
}
.fleet-card:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.fleet-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.fleet-name { font-weight: 600; font-size: 13px; min-width: 130px; }
.fleet-status-badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; }
.fleet-status-badge.sea { background: #d4edda; color: #155724; }
.fleet-status-badge.anchor { background: #fff3cd; color: #856404; }
.fleet-status-badge.moored { background: #f8d7da; color: #721c24; }
.fleet-speed { font-size: 12px; color: #555; }
.fleet-dest { font-size: 12px; }
.fleet-dest b { color: var(--primary); }
.fleet-eta { font-size: 11px; color: #888; }
.fleet-eta.overdue { color: var(--danger); }
.fleet-details {
  display: none;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
  font-size: 12px;
  color: #888;
  gap: 4px 14px;
  flex-wrap: wrap;
}
.fleet-card.expanded .fleet-details { display: flex; }
.fleet-toggle {
  padding: 8px 16px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 8px;
  color: var(--primary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}
.fleet-toggle:hover { border-color: var(--primary); background: var(--primary-light); }
.fleet-toggle.active { background: var(--primary); color: white; }
.fleet-loading { text-align: center; padding: 40px; color: var(--text-light); font-size: 13px; }
.fleet-footer { font-size: 11px; color: var(--text-light); text-align: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); }
.empty-fleet { text-align: center; padding: 30px; color: var(--text-light); }
</style>
</head>
<body>
<div id="app">
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-top">
      <h1 class="logo">🚢 WINNING <span>Shipping AI</span></h1>
      <span class="version">v2.0</span>
    </div>
    <p class="subtitle">船舶法规 · 体系 · 技术 · 智能合规助手</p>
  </header>

  <!-- 模块切换 -->
  <nav class="module-nav">
    <button class="module-btn active" data-module="regulations" onclick="switchModule('regulations')">
      <span class="icon">📋</span>
      <span class="label">法规</span>
    </button>
    <button class="module-btn" data-module="systems" onclick="switchModule('systems')">
      <span class="icon">🏢</span>
      <span class="label">体系</span>
    </button>
    <button class="module-btn" data-module="tech" onclick="switchModule('tech')">
      <span class="icon">🔧</span>
      <span class="label">技术</span>
    </button>
    <button class="module-btn" data-module="ships" onclick="switchModule('ships')">
      <span class="icon">🚢</span>
      <span class="label">船舶</span>
    </button>
  </nav>

  <!-- 快捷指令 -->
  <div class="quick-actions" id="quickActions"></div>

  <!-- 主聊天区域 -->
  <main class="chat-area" id="chatArea">
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-icon">🚢</div>
      <h2>WINNING Shipping AI</h2>
      <p>船舶法规智能合规助手</p>
      <div class="welcome-tips">
        <div class="tip-item"><span class="tip-icon">💬</span><span>输入法规关键词或问题</span></div>
        <div class="tip-item"><span class="tip-icon">📷</span><span>上传照片判断合规性</span></div>
        <div class="tip-item"><span class="tip-icon">📄</span><span>粘贴缺陷描述匹配条款</span></div>
        <div class="tip-item"><span class="tip-icon">🔗</span><span>引用IMO官网原文</span></div>
      </div>
    </div>
    <div id="messages"></div>
    <div id="loadingIndicator" class="loading hidden">
      <div class="dot-pulse"></div>
      <span>思考中...</span>
    </div>
  </main>

  <!-- 🚢 船舶动态面板 -->
  <div class="fleet-panel" id="fleetPanel">
    <button class="fleet-toggle" id="fleetToggle" onclick="toggleFleetView()">
      🚢 查看船舶动态
    </button>
    <div id="fleetContent">
      <div class="fleet-loading">
        <div class="dot-pulse" style="margin:0 auto 8px;"></div>
        <span>加载船舶动态数据...</span>
      </div>
    </div>
  </div>

  <!-- 输入区域 -->
  <footer class="input-area">
    <div class="input-wrapper">
      <button class="attach-btn" id="imageUploadBtn" title="上传图片">
        <span>📷</span>
        <input type="file" id="imageInput" accept="image/*" hidden>
      </button>
      <button class="attach-btn" id="fileUploadBtn" title="上传文件（仅本地知识库模块）">
        <span>📎</span>
        <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt" hidden>
      </button>
      <textarea id="messageInput" rows="1" placeholder="输入法规问题，如：lifeboat要求..."></textarea>
      <button class="send-btn" id="sendBtn" disabled><span>➤</span></button>
    </div>
    <p class="input-hint">WINNING Shipping AI · 仅供参考，请以IMO官方原文为准</p>
  </footer>
</div>

<!-- 图片预览弹窗 -->
<div id="imagePreview" class="modal hidden">
  <div class="modal-content">
    <img id="previewImg" src="" alt="预览">
    <button class="modal-close" onclick="closeImagePreview()">✕</button>
    <div class="modal-actions">
      <button class="btn-primary" onclick="analyzeImage()">📷 分析此图片</button>
      <button class="btn-secondary" onclick="removeImage()">移除</button>
    </div>
  </div>
</div>

<script>
// ====== CONFIG ======
const CONFIG = {
  API_BASE_URL: 'https://api.winningshippingai.com',
  modules: {
    regulations: {
      name: '法规', icon: '📋',
      placeholder: '输入法规问题，如：lifeboat维护要求...',
      description: 'IMO公约 · SOLAS · MARPOL · MLC',
      quickActions: [
        { text: '🛟 救生设备', query: '救生设备有哪些检查要求？' },
        { text: '🔥 消防设备', query: '消防设备检验周期是什么？' },
        { text: '📋 PSC缺陷', query: 'PSC检查常见缺陷有哪些？' },
        { text: '🌍 MARPOL VI', query: 'MARPOL附则VI的最新要求' }
      ],
      supportImage: true
    },
    systems: {
      name: '体系', icon: '🏢',
      placeholder: '输入体系文件问题，如：机舱值班制度...',
      description: '公司体系文件 · SMS · 管理制度',
      quickActions: [
        { text: '📋 管理体系', query: '公司管理体系文件有哪些？' },
        { text: '📝 操作规程', query: '关键操作有哪些规程要求？' }
      ],
      supportImage: false
    },
    tech: {
      name: '技术', icon: '🔧',
      placeholder: '输入技术资料问题，如：副机型号参数...',
      description: '设备手册 · 技术参数 · 维护保养',
      quickActions: [
        { text: '⚙️ 设备列表', query: '有哪些主要设备的技术资料？' },
        { text: '🔧 维护周期', query: '主要设备的维护保养周期？' }
      ],
      supportImage: true
    },
    ships: {
      name: '船舶', icon: '🚢',
      placeholder: '输入船舶名称或证书问题...',
      description: '船队资料 · 证书 · 检验报告',
      quickActions: [
        { text: '🚢 船队列表', query: 'WINNING集团船队有哪些船舶？' },
        { text: '📄 证书查询', query: '各船主要证书有哪些？' },
        { text: '📍 船舶动态', query: '查看船舶动态' }
      ],
      supportImage: false
    }
  }
};

// ====== 状态管理 ======
const STATE = {
  currentModule: 'regulations',
  messages: {},
  imageData: null,
  conversationHistory: {},
  isProcessing: false,
  fleetShowing: false,
  fleetData: null,
  fleetFilter: 'all'
};

try {
  const saved = localStorage.getItem('wsai_history');
  if (saved) STATE.conversationHistory = JSON.parse(saved);
} catch(e) {}

// ====== DOM ======
const els = {
  chatArea: document.getElementById('chatArea'),
  messages: document.getElementById('messages'),
  welcome: document.getElementById('welcomeScreen'),
  input: document.getElementById('messageInput'),
  sendBtn: document.getElementById('sendBtn'),
  loading: document.getElementById('loadingIndicator'),
  quickActions: document.getElementById('quickActions'),
  imageInput: document.getElementById('imageInput'),
  fileInput: document.getElementById('fileInput'),
  imageUploadBtn: document.getElementById('imageUploadBtn'),
  imagePreview: document.getElementById('imagePreview'),
  previewImg: document.getElementById('previewImg'),
  fleetPanel: document.getElementById('fleetPanel'),
  fleetContent: document.getElementById('fleetContent'),
  fleetToggle: document.getElementById('fleetToggle')
};

// ====== 船舶动态加载 ======
async function loadFleetData() {
  try {
    const resp = await fetch('data/hifleet_daily.json?_t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    STATE.fleetData = await resp.json();
    renderFleet();
  } catch(e) {
    STATE.fleetData = getTestFleetData();
    renderFleet();
  }
}

function getTestFleetData() {

    {"name":"WINNING CONFIDENCE","status":"在航","speed_kn":10.0,"destination":"CNTAO","eta":"2026-06-05 14:00","lat":-28.45,"lon":12.20,"heading_deg":128,"draught_m":18.6,"mmsi":"566311000","imo":"9325001","updateTime":"2026-05-03 17:37:09"},
    {"name":"WINNING DILIGENCE","status":"在航","speed_kn":11.0,"destination":"CN FAN","eta":"2026-05-08 15:00","lat":0.53,"lon":108.18,"heading_deg":357,"draught_m":18.2,"mmsi":"566545000","imo":"9374088","updateTime":"2026-05-03 17:33:18"},
    {"name":"WINNING ENDURANCE","status":"在航","speed_kn":11.0,"destination":"IN VIZ","eta":"2026-05-20 05:00","lat":-31.38,"lon":36.40,"heading_deg":67,"draught_m":18.0,"mmsi":"566845000","imo":"9232058","updateTime":"2026-05-03 17:35:57"},
    {"name":"WINNING EXCELLENCE","status":"锚泊","speed_kn":null,"destination":"PORT DE BOKE GUINEA","eta":"2026-04-24 14:00","lat":10.35,"lon":-14.79,"heading_deg":178,"draught_m":11.7,"mmsi":"563114700","imo":"9279393","updateTime":"2026-05-03 17:34:51"},
    {"name":"WINNING FAITH","status":"锚泊","speed_kn":0.1,"destination":"CN FAN","eta":"2026-05-02 04:00","lat":21.17,"lon":108.41,"heading_deg":293,"draught_m":18.2,"mmsi":"566963000","imo":"9314076","updateTime":"2026-05-03 17:32:48"},
    {"name":"WINNING GRACE","status":"在航","speed_kn":3.5,"destination":"MOREBAYA","eta":"2026-04-29 20:00","lat":9.24,"lon":-13.73,"heading_deg":272,"draught_m":11.3,"mmsi":"566100000","imo":"9722948","updateTime":"2026-05-03 17:37:42"},
    {"name":"WINNING HOPE","status":"在航","speed_kn":9.7,"destination":"YANTAI","eta":"2026-05-17 08:00","lat":-9.01,"lon":100.92,"heading_deg":58,"draught_m":18.7,"mmsi":"563152000","imo":"9722950","updateTime":"2026-05-03 17:28:09"},
    {"name":"WINNING INTEGRITY","status":"在航","speed_kn":10.3,"destination":"CN YNT","eta":"2026-06-15 13:00","lat":3.45,"lon":-11.47,"heading_deg":149,"draught_m":18.3,"mmsi":"563312300","imo":"9633068","updateTime":"2026-05-03 17:35:38"},
    {"name":"WINNING JOY","status":"在航","speed_kn":11.4,"destination":"SG SIN","eta":"2026-05-09 02:00","lat":22.08,"lon":119.81,"heading_deg":179,"draught_m":10.2,"mmsi":"563222500","imo":"9492220","updateTime":"2026-05-03 17:33:04"},
    {"name":"WINNING KINDNESS","status":"在航","speed_kn":10.2,"destination":"CN YNT","eta":"2026-05-06 03:00","lat":27.96,"lon":123.27,"heading_deg":6,"draught_m":18.3,"mmsi":"563131000","imo":"9335240","updateTime":"2026-05-03 17:37:43"},
    {"name":"WINNING PRIDE","status":"在航","speed_kn":9.9,"destination":"GN BRP","eta":"2026-05-03 14:00","lat":10.08,"lon":-14.84,"heading_deg":3,"draught_m":9.8,"mmsi":"374705000","imo":"9450234","updateTime":"2026-05-03 17:35:34"},
    {"name":"SUNNY SAILOR","status":"在航","speed_kn":12.0,"destination":"GN PORT DE BOKE","eta":"2026-05-11 09:00","lat":-6.39,"lon":-4.97,"heading_deg":326,"draught_m":9.3,"mmsi":"370118000","imo":"9439125","updateTime":"2026-05-03 17:37:45"},
    {"name":"SUNNY LABE","status":"系泊","speed_kn":null,"destination":"CN YNT","eta":"2026-05-01 00:00","lat":37.58,"lon":121.39,"heading_deg":270,"draught_m":18.2,"mmsi":"352002765","imo":"9271597","updateTime":"2026-05-03 17:35:31"}
  ]};
}

function getStatusClass(s) {
  if (s === '锚泊') return 'anchor';
  if (s === '系泊') return 'moored';
  return 'sea';
}

function renderFleet() {
  if (!STATE.fleetData) return;
  const container = document.getElementById('fleetContent');
  const search = document.getElementById('fleetSearchInput');
  const searchText = search ? search.value.toLowerCase().trim() : '';
  
  let vessels = STATE.fleetData.vessels || [];
  let filtered = vessels.filter(v => {
    if (STATE.fleetFilter !== 'all' && getStatusClass(v.status) !== STATE.fleetFilter) return false;
    if (searchText && !v.name.toLowerCase().includes(searchText) && !(v.destination||'').toLowerCase().includes(searchText)) return false;
    return true;
  });

  const winning = filtered.filter(v => v.name.startsWith('WINNING'));
  const sunny = filtered.filter(v => v.name.startsWith('SUNNY'));
  const total = vessels.length;
  const sea = vessels.filter(v=>v.status==='在航').length;
  const anchor = vessels.filter(v=>v.status==='锚泊').length;
  const moored = vessels.filter(v=>v.status==='系泊').length;

  let html = `<div class="fleet-header">
    <h3>🚢 A.WINNING FLEET <span style="font-weight:400;font-size:12px;color:var(--text-light)">(${total}艘)</span></h3>
    <div class="fleet-stats">
      <span class="fleet-stat sea">🟢 ${sea}</span>
      <span class="fleet-stat anchor">🟡 ${anchor}</span>
      <span class="fleet-stat moored">🔴 ${moored}</span>
    </div>
  </div>`;
  html += `<div class="fleet-time">📡 ${STATE.fleetData.timestamp || ''}</div>`;
  html += `<div class="fleet-filter">
    <input class="fleet-search" id="fleetSearchInput" placeholder="🔍 搜索船名/目的港..." oninput="renderFleet()">
    <button class="active ${STATE.fleetFilter==='all'?'':''}" onclick="setFleetFilter('all')" data-ff="all">全部 ${total}</button>
    <button class="sea-filter ${STATE.fleetFilter==='sea'?'active':''}" onclick="setFleetFilter('sea')">🟢 在航 ${sea}</button>
    <button class="anchor-filter ${STATE.fleetFilter==='anchor'?'active':''}" onclick="setFleetFilter('anchor')">🟡 锚泊 ${anchor}</button>
    <button class="moored-filter ${STATE.fleetFilter==='moored'?'active':''}" onclick="setFleetFilter('moored')">🔴 系泊 ${moored}</button>
  </div>`;

  function sec(title, vs) {
    let s = `<div class="fleet-section"><h4>${title} <span>(${vs.length}艘)</span></h4>`;
    vs.forEach(v => {
      const sc = getStatusClass(v.status);
      const overdue = v.eta && v.eta < '2026-05-01';
      s += `<div class="fleet-card" onclick="this.classList.toggle('expanded')">
        <div class="fleet-row">
          <span class="fleet-name">${v.name}</span>
          <span class="fleet-status-badge ${sc}">${v.status==='在航'?'🟢':v.status==='锚泊'?'🟡':'🔴'} ${v.status}</span>
          ${v.speed_kn ? `<span class="fleet-speed">${v.speed_kn}kn</span>` : ''}
          ${v.destination ? `<span class="fleet-dest">→ <b>${v.destination}</b></span>` : ''}
          ${v.eta ? `<span class="fleet-eta ${overdue?'overdue':''}">ETA ${v.eta}</span>` : ''}
        </div>
        <div class="fleet-details">
          ${v.lat ? `<span>📍 ${v.lat.toFixed(2)}, ${v.lon.toFixed(2)}</span>` : ''}
          ${v.heading_deg ? `<span>🧭 ${v.heading_deg}°</span>` : ''}
          ${v.draught_m ? `<span>📏 ${v.draught_m}m</span>` : ''}
          ${v.mmsi ? `<span>📡 ${v.mmsi}</span>` : ''}
          ${v.imo ? `<span>🆔 ${v.imo}</span>` : ''}
          ${v.updateTime ? `<span>⏱ ${v.updateTime}</span>` : ''}
        </div>
      </div>`;
    });
    s += '</div>';
    return s;
  }

  if (winning.length) html += sec('WINNING 系列', winning);
  if (sunny.length) html += sec('SUNNY 系列', sunny);
  if (!filtered.length) html += '<div class="empty-fleet"><p>没有匹配的船舶</p></div>';

  container.innerHTML = html;
}

function setFleetFilter(filter) {
  STATE.fleetFilter = filter;
  document.querySelectorAll('.fleet-filter button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`.fleet-filter button[onclick*="'${filter}'"]`).forEach(b => b.classList.add('active'));
  renderFleet();
}

window.toggleFleetView = function() {
  STATE.fleetShowing = !STATE.fleetShowing;
  const panel = document.getElementById('fleetPanel');
  const toggle = document.getElementById('fleetToggle');
  const ia = document.querySelector('.input-area');
  
  if (STATE.fleetShowing) {
    panel.classList.add('active');
    toggle.innerHTML = '💬 进入对话模式';
    toggle.classList.add('active');
    els.chatArea.style.display = 'none';
    ia.style.display = 'none';
    if (!STATE.fleetData) loadFleetData();
  } else {
    panel.classList.remove('active');
    toggle.innerHTML = '🚢 查看船舶动态';
    toggle.classList.remove('active');
    els.chatArea.style.display = 'flex';
    ia.style.display = '';
    renderQuickActions('ships');
    renderMessages('ships');
  }
};

// ====== 模块切换 ======
window.switchModule = function(module) {
  STATE.currentModule = module;
  
  document.querySelectorAll('.module-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.module === module);
  });
  
  const config = CONFIG.modules[module];
  els.input.placeholder = config.placeholder;
  
  const fp = document.getElementById('fleetPanel'), ft = document.getElementById('fleetToggle'), ia = document.querySelector('.input-area');
  if (module === 'ships') {
    STATE.fleetShowing = true;
    fp.classList.add('active');
    ft.innerHTML = '💬 进入对话模式';
    ft.classList.add('active');
    els.chatArea.style.display = 'none';
    ia.style.display = 'none';
    renderQuickActions(module);
    if (!STATE.fleetData) loadFleetData();
  } else {
    STATE.fleetShowing = false;
    fp.classList.remove('active');
    els.chatArea.style.display = 'flex';
    ia.style.display = '';
    renderQuickActions(module);
    renderMessages(module);
  }
};

// 渲染快捷指令
function renderQuickActions(module) {
  const actions = CONFIG.modules[module].quickActions;
  els.quickActions.innerHTML = actions.map(a => 
    `<button class="quick-btn" onclick="quickAsk('${a.query.replace(/'/g, "\\'")}')">${a.text}</button>`
  ).join('');
}

window.quickAsk = function(query) {
  // 如果是船舶动态查询
  if (query === '查看船舶动态') {
    window.toggleFleetView();
    return;
  }
  els.input.value = query;
  sendMessage();
};

// ====== 发送消息 ======
async function sendMessage() {
  const text = els.input.value.trim();
  if (!text && !STATE.imageData) return;
  if (STATE.isProcessing) return;
  
  STATE.isProcessing = true;
  els.sendBtn.disabled = true;
  
  els.welcome.classList.add('hidden');
  
  const userMsg = { role: 'user', text: text, image: STATE.imageData };
  addMessage(userMsg);
  
  els.input.value = '';
  els.input.style.height = 'auto';
  
  els.loading.classList.remove('hidden');
  scrollToBottom();
  
  try {
    const response = await callAPI(text, STATE.currentModule, STATE.imageData);
    els.loading.classList.add('hidden');
    addMessage({ role: 'assistant', text: response.reply });
    saveHistory(text, response.reply);
    if (STATE.imageData) STATE.imageData = null;
  } catch (err) {
    els.loading.classList.add('hidden');
    addMessage({ role: 'assistant', text: `⚠️ 抱歉，请求失败了：${err.message || '网络错误，请稍后重试'}` });
  }
  
  STATE.isProcessing = false;
  els.sendBtn.disabled = false;
  scrollToBottom();
}

async function callAPI(message, module, imageData) {
  const history = STATE.conversationHistory[module] || [];
  const lastHistory = history.slice(-6).map(h => ({ role: h.role, content: h.text }));
  
  const body = { message, module, history: lastHistory, imageUrl: imageData };
  
  const response = await fetch(`${CONFIG.API_BASE_URL}/api/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.detail || `HTTP ${response.status}`);
  }
  
  return response.json();
}

// ====== 消息渲染 ======
function addMessage(msg) {
  const div = document.createElement('div');
  div.className = `message ${msg.role}`;
  const avatar = msg.role === 'user' ? '👤' : '🤖';
  let content = '';
  if (msg.image) content += `<img src="${msg.image}" class="image-attachment" alt="上传图片">`;
  if (msg.text) content += formatMessage(msg.text);
  div.innerHTML = `<div class="message-avatar">${avatar}</div><div class="message-content">${content}</div>`;
  els.messages.appendChild(div);
  scrollToBottom();
}

function formatMessage(text) {
  if (!text) return '';
  let html = text;
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/SOLAS[^\s,。；]*|MARPOL[^\s,。；]*|MLC[^\s,。；]*/g, match => {
    const safe = match.replace(/'/g, "\\'");
    return `<span class="citation" onclick="quickAsk('请详细展示${safe}的中文原文和英文原文对照')">${match}</span>`;
  });
  const paragraphs = html.split('\n\n');
  html = paragraphs.map(p => {
    const trimmed = p.trim();
    if (!trimmed) return '';
    if (trimmed.match(/^[\-\*]\s/m)) {
      const items = trimmed.split('\n').filter(l => l.match(/^[\-\*]\s/));
      return '<ul>' + items.map(i => `<li>${i.replace(/^[\-\*]\s/, '')}</li>`).join('') + '</ul>';
    }
    if (trimmed.match(/^\d+\.\s/m)) {
      const items = trimmed.split('\n').filter(l => l.match(/^\d+\.\s/));
      return '<ol>' + items.map(i => `<li>${i.replace(/^\d+\.\s/, '')}</li>`).join('') + '</ol>';
    }
    if (trimmed.startsWith('>')) {
      return `<blockquote>${trimmed.replace(/^>\s?/gm, '').replace(/\n/g, '<br>')}</blockquote>`;
    }
    return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return html;
}

function saveHistory(userText, assistantText) {
  const module = STATE.currentModule;
  if (!STATE.conversationHistory[module]) STATE.conversationHistory[module] = [];
  STATE.conversationHistory[module].push(
    { role: 'user', text: userText, time: Date.now() },
    { role: 'assistant', text: assistantText, time: Date.now() }
  );
  if (STATE.conversationHistory[module].length > 20) {
    STATE.conversationHistory[module] = STATE.conversationHistory[module].slice(-20);
  }
  try { localStorage.setItem('wsai_history', JSON.stringify(STATE.conversationHistory)); } catch(e) {}
}

function renderMessages(module) {
  els.messages.innerHTML = '';
  const history = STATE.conversationHistory[module] || [];
  if (history.length === 0) { els.welcome.classList.remove('hidden'); return; }
  els.welcome.classList.add('hidden');
  history.forEach(msg => addMessage(msg));
  scrollToBottom();
}

// ====== 图片处理 ======
function compressImage(dataUrl, maxWidth, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality || 0.7));
    };
    img.src = dataUrl;
  });
}

els.imageUploadBtn.addEventListener('click', () => { els.imageInput.click(); });
els.imageInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (event) => {
    const raw = event.target.result;
    try { STATE.imageData = await compressImage(raw, 800, 0.7); } catch { STATE.imageData = raw; }
    els.previewImg.src = STATE.imageData;
    els.imagePreview.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

window.closeImagePreview = function() { els.imagePreview.classList.add('hidden'); };
window.analyzeImage = function() { els.imagePreview.classList.add('hidden'); els.input.value = '请分析这张图片中的设备状态，判断是否存在不合规情况，并引用相关法规条款。'; sendMessage(); };
window.removeImage = function() { STATE.imageData = null; els.imagePreview.classList.add('hidden'); };

els.input.addEventListener('input', () => {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 120) + 'px';
  els.sendBtn.disabled = !els.input.value.trim() && !STATE.imageData;
});

els.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

els.sendBtn.addEventListener('click', sendMessage);

function scrollToBottom() {
  requestAnimationFrame(() => { els.chatArea.scrollTop = els.chatArea.scrollHeight; });
}

document.addEventListener('DOMContentLoaded', () => {
  switchModule('regulations');
});
</script>
</body>
