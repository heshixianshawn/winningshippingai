<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>船舶动态 - WINNING Shipping AI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .fleet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .fleet-header h2 { margin: 0; font-size: 22px; }
        .fleet-stats {
            display: flex;
            gap: 16px;
            font-size: 14px;
        }
        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }
        .stat-badge.sea { background: #d4edda; color: #155724; }
        .stat-badge.anchor { background: #fff3cd; color: #856404; }
        .stat-badge.moored { background: #f8d7da; color: #721c24; }
        .update-time {
            font-size: 13px;
            color: var(--gray-color);
        }
        .ship-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 14px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            transition: box-shadow .15s;
            cursor: pointer;
        }
        .ship-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .ship-name {
            font-weight: 700;
            font-size: 15px;
            min-width: 160px;
            flex-shrink: 0;
        }
        .ship-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            min-width: 44px;
            justify-content: center;
        }
        .ship-status.sea { background: #d4edda; color: #155724; }
        .ship-status.anchor { background: #fff3cd; color: #856404; }
        .ship-status.moored { background: #f8d7da; color: #721c24; }
        .ship-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            font-size: 13px;
            color: #555;
            flex: 1;
            min-width: 200px;
        }
        .ship-detail span { white-space: nowrap; }
        .detail-label { color: #999; margin-right: 2px; }
        .dest-highlight { color: var(--primary-color); font-weight: 500; }
        .eta-overdue { color: var(--danger-color); }
        .fleet-section { margin-bottom: 32px; }
        .fleet-section h3 {
            font-size: 17px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: 14px;
            color: var(--primary-dark);
        }
        .fleet-section h3 span { font-weight: 400; font-size: 14px; color: var(--gray-color); }
        .ship-details-expanded {
            display: none;
            width: 100%;
            padding: 12px 0 4px 0;
            margin-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 13px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 6px;
        }
        .ship-card.expanded .ship-details-expanded { display: grid; }
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .filter-btn {
            padding: 5px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all .15s;
        }
        .filter-btn:hover { border-color: var(--primary-color); }
        .filter-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
        .filter-btn.active.sea-filter { background: #28a745; border-color: #28a745; }
        .filter-btn.active.anchor-filter { background: #ffc107; color: #333; border-color: #ffc107; }
        .filter-btn.active.moored-filter { background: #dc3545; border-color: #dc3545; }
        .search-input {
            padding: 5px 14px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            font-size: 13px;
            outline: none;
            flex: 1;
            min-width: 180px;
            max-width: 300px;
        }
        .search-input:focus { border-color: var(--primary-color); }
        .loading { text-align: center; padding: 60px 0; color: var(--gray-color); }
        .loading .spinner {
            display: inline-block;
            width: 32px; height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .data-source { font-size: 12px; color: #999; margin-top: 20px; text-align: center; }
        .series-tag {
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 10px;
            background: #e8f4f8;
            color: var(--primary-color);
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <div class="layout-wrapper">
        <header class="main-header">
            <div class="container header-content">
                <h1 class="logo">
                    <a href="index.html">
                        <span class="logo-icon">⚓</span>
                        WINNING Shipping AI
                    </a>
                </h1>
                <nav class="main-nav">
                    <a href="index.html">首页</a>
                    <a href="regulations.html">船舶法规</a>
                    <a href="hifleet.html" class="active">船舶动态</a>
                    <a href="about.html">关于</a>
                </nav>
            </div>
        </header>

        <main class="container main-content">
            <div class="fleet-header">
                <h2>🚢 A.WINNING FLEET · 船舶动态</h2>
                <div class="fleet-stats" id="fleetStats">
                    <span class="stat-badge sea"><span id="countSea">—</span> 在航</span>
                    <span class="stat-badge anchor"><span id="countAnchor">—</span> 锚泊</span>
                    <span class="stat-badge moored"><span id="countMoored">—</span> 系泊</span>
                </div>
            </div>

            <div class="update-time" id="updateTime">数据加载中...</div>

            <div class="filter-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索船名、目的港..." oninput="renderFleet()">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部 <span id="totalCount">—</span></button>
                <button class="filter-btn sea-filter" data-filter="sea" onclick="setFilter('sea')">🟢 在航</button>
                <button class="filter-btn anchor-filter" data-filter="anchor" onclick="setFilter('anchor')">🟡 锚泊</button>
                <button class="filter-btn moored-filter" data-filter="moored" onclick="setFilter('moored')">🔴 系泊</button>
            </div>

            <div id="fleetContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top:16px">正在加载船舶动态数据...</p>
                </div>
            </div>

            <div class="data-source">
                数据来源：HiFleet · 每日采集更新 · 仅供内部参考
            </div>
        </main>

        <footer class="main-footer">
            <div class="container footer-content">
                <p>&copy; 2026 WINNING Shipping AI · 船舶法规与动态查询平台</p>
            </div>
        </footer>
    </div>

    <script>
        let fleetData = null;
        let currentFilter = 'all';

        async function loadData() {
            try {
                const resp = await fetch('data/hifleet_daily.json?_t=' + Date.now());
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const text = await resp.text();
                fleetData = JSON.parse(text);
                renderFleet();
            } catch(e) {
                // 没有JSON文件时用内嵌测试数据
                console.warn('无法加载外部数据，使用测试数据:', e.message);
                fleetData = getTestData();
                renderFleet();
            }
        }

        function statusClass(s) {
            if (s === '锚泊') return 'anchor';
            if (s === '系泊') return 'moored';
            return 'sea';
        }

        function renderFleet() {
            if (!fleetData) return;
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const allVessels = fleetData.vessels || [];
            
            let filtered = allVessels.filter(v => {
                if (currentFilter !== 'all' && statusClass(v.status) !== currentFilter) return false;
                if (search && !v.name.toLowerCase().includes(search) && !(v.destination||'').toLowerCase().includes(search)) return false;
                return true;
            });

            const winning = filtered.filter(v => v.name.startsWith('WINNING'));
            const sunny = filtered.filter(v => v.name.startsWith('SUNNY'));

            document.getElementById('totalCount').textContent = filtered.length;
            
            // 更新统计
            const all = allVessels;
            document.getElementById('countSea').textContent = all.filter(v => v.status === '在航').length;
            document.getElementById('countAnchor').textContent = all.filter(v => v.status === '锚泊').length;
            document.getElementById('countMoored').textContent = all.filter(v => v.status === '系泊').length;
            document.getElementById('updateTime').textContent = '📡 最后更新：' + (fleetData.timestamp || '未知');

            let html = '';
            if (winning.length) html += renderSection('WINNING 系列', winning);
            if (sunny.length) html += renderSection('SUNNY 系列', sunny);
            if (!filtered.length) html = '<div class="loading"><p>没有匹配的船舶</p></div>';

            document.getElementById('fleetContent').innerHTML = html;
        }

        function renderSection(title, vessels) {
            const series = title.includes('WINNING') ? 'winning' : 'sunny';
            let h = `<div class="fleet-section"><h3>${title} <span>(${vessels.length}艘)</span></h3>`;
            vessels.forEach(v => {
                const sc = statusClass(v.status);
                const overdue = v.eta && v.eta < '2026-05-01';
                h += `<div class="ship-card" onclick="this.classList.toggle('expanded')">
                    <div class="ship-name">${v.name}</div>
                    <div class="ship-status ${sc}">${v.status === '在航' ? '🟢' : v.status === '锚泊' ? '🟡' : '🔴'} ${v.status}</div>
                    <div class="ship-detail">
                        ${v.speed_kn ? `<span><span class="detail-label">航速</span>${v.speed_kn} kn</span>` : ''}
                        ${v.destination ? `<span><span class="detail-label">→</span><span class="dest-highlight">${v.destination}</span></span>` : ''}
                        ${v.eta ? `<span><span class="detail-label">ETA</span><span class="${overdue ? 'eta-overdue' : ''}">${v.eta}</span></span>` : ''}
                    </div>
                    <div class="ship-details-expanded">
                        ${v.lat ? `<span>📍 ${v.lat.toFixed(2)}, ${v.lon.toFixed(2)}</span>` : ''}
                        ${v.heading_deg ? `<span>🧭 航向 ${v.heading_deg}°</span>` : ''}
                        ${v.draught_m ? `<span>📏 吃水 ${v.draught_m}m</span>` : ''}
                        ${v.mmsi ? `<span>📡 MMSI ${v.mmsi}</span>` : ''}
                        ${v.imo ? `<span>🆔 IMO ${v.imo}</span>` : ''}
                        ${v.updateTime ? `<span>⏱ ${v.updateTime}</span>` : ''}
                    </div>
                </div>`;
            });
            h += '</div>';
            return h;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll(`.filter-btn[data-filter="${filter}"]`).forEach(b => b.classList.add('active'));
            renderFleet();
        }

        function getTestData() {
            return {
                "timestamp": "2026-05-03 17:37:54",
                "group": "A.WINNING FLEET",
                "total": 59,
                "winning": 34,
                "sunny": 25,
                "vessels": [
                    {"name":"WINNING CONFIDENCE","status":"在航","speed_kn":10.0,"destination":"CNTAO","eta":"2026-06-05 14:00","lat":-28.45,"lon":12.20,"heading_deg":128,"draught_m":18.6,"mmsi":"566311000","imo":"9325001","updateTime":"2026-05-03 17:37:09"},
                    {"name":"WINNING DILIGENCE","status":"在航","speed_kn":11.0,"destination":"CN FAN","eta":"2026-05-08 15:00","lat":0.53,"lon":108.18,"heading_deg":357,"draught_m":18.2,"mmsi":"566545000","imo":"9374088","updateTime":"2026-05-03 17:33:18"},
                    {"name":"WINNING ENDURANCE","status":"在航","speed_kn":11.0,"destination":"IN VIZ","eta":"2026-05-20 05:00","lat":-31.38,"lon":36.40,"heading_deg":67,"draught_m":18.0,"mmsi":"566845000","imo":"9232058","updateTime":"2026-05-03 17:35:57"},
                    {"name":"WINNING EXCELLENCE","status":"锚泊","speed_kn":null,"destination":"PORT DE BOKE GUINEA","eta":"2026-04-24 14:00","lat":10.35,"lon":-14.79,"heading_deg":178,"draught_m":11.7,"mmsi":"563114700","imo":"9279393","updateTime":"2026-05-03 17:34:51"},
                    {"name":"WINNING FAITH","status":"锚泊","speed_kn":0.1,"destination":"CN FAN","eta":"2026-05-02 04:00","lat":21.17,"lon":108.41,"heading_deg":293,"draught_m":18.2,"mmsi":"566963000","imo":"9314076","updateTime":"2026-05-03 17:32:48"},
                    {"name":"WINNING GRACE","status":"在航","speed_kn":3.5,"destination":"MOREBAYA","eta":"2026-04-29 20:00","lat":9.24,"lon":-13.73,"heading_deg":272,"draught_m":11.3,"mmsi":"566100000","imo":"9722948","updateTime":"2026-05-03 17:37:42"},
                    {"name":"WINNING HOPE","status":"在航","speed_kn":9.7,"destination":"YANTAI","eta":"2026-05-17 08:00","lat":-9.01,"lon":100.92,"heading_deg":58,"draught_m":18.7,"mmsi":"563152000","imo":"9722950","updateTime":"2026-05-03 17:28:09"},
                    {"name":"WINNING INTEGRITY","status":"在航","speed_kn":10.3,"destination":"CN YNT","eta":"2026-06-15 13:00","lat":3.45,"lon":-11.47,"heading_deg":149,"draught_m":18.3,"mmsi":"563312300","imo":"9633068","updateTime":"2026-05-03 17:35:38"},
                    {"name":"WINNING JOY","status":"在航","speed_kn":11.4,"destination":"SG SIN","eta":"2026-05-09 02:00","lat":22.08,"lon":119.81,"heading_deg":179,"draught_m":10.2,"mmsi":"563222500","imo":"9492220","updateTime":"2026-05-03 17:33:04"},
                    {"name":"WINNING KINDNESS","status":"在航","speed_kn":10.2,"destination":"CN YNT","eta":"2026-05-06 03:00","lat":27.96,"lon":123.27,"heading_deg":6,"draught_m":18.3,"mmsi":"563131000","imo":"9335240","updateTime":"2026-05-03 17:37:43"},
                    {"name":"WINNING PRIDE","status":"在航","speed_kn":9.9,"destination":"GN BRP","eta":"2026-05-03 14:00","lat":10.08,"lon":-14.84,"heading_deg":3,"draught_m":9.8,"mmsi":"374705000","imo":"9450234","updateTime":"2026-05-03 17:35:34"},
                    {"name":"SUNNY SAILOR","status":"在航","speed_kn":12.0,"destination":"GN PORT DE BOKE","eta":"2026-05-11 09:00","lat":-6.39,"lon":-4.97,"heading_deg":326,"draught_m":9.3,"mmsi":"370118000","imo":"9439125","updateTime":"2026-05-03 17:37:45"},
                    {"name":"SUNNY LABE","status":"系泊","speed_kn":null,"destination":"CN YNT","eta":"2026-05-01 00:00","lat":37.58,"lon":121.39,"heading_deg":270,"draught_m":18.2,"mmsi":"352002765","imo":"9271597","updateTime":"2026-05-03 17:35:31"}
                ]
            };
        }

        // 初始化
        loadData();

        // 定时刷新（每5分钟尝试重新加载）
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
